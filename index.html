<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020810;
    color: #aeeeff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(
            circle at center,
            rgba(0,150,255,.20),
            #020810 70%
        );
}

.grid {
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(50,190,255,.10) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(50,190,255,.10) 1px,
            transparent 1px
        );

    background-size: 45px 45px;
}

/* MAIN */

.main {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 100%;

    padding: 25px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.header {
    display: flex;
    justify-content: space-between;
}

.system {
    font-size: 10px;
    letter-spacing: 4px;
    opacity: .45;
}

.logo {
    margin-top: 7px;
    font-size: 24px;
    letter-spacing: 6px;

    text-shadow:
        0 0 15px rgba(80,220,255,.7);
}

.clock {
    text-align: right;
}

.time {
    font-size: 30px;
}

.date {
    margin-top: 5px;
    font-size: 9px;
    letter-spacing: 2px;
    opacity: .4;
}

/* FACE SCANNER */

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.faceScanner {
    position: relative;

    width: 300px;
    height: 240px;

    border: 1px solid rgba(90,220,255,.7);

    background: rgba(0,30,50,.5);

    overflow: hidden;

    box-shadow:
        0 0 25px rgba(0,180,255,.15),
        inset 0 0 30px rgba(0,180,255,.08);
}

#camera {
    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    opacity: .9;
}

.scannerCorners {
    position: absolute;
    inset: 10px;

    pointer-events: none;
}

.scannerCorners::before,
.scannerCorners::after {
    content: "";

    position: absolute;

    width: 25px;
    height: 25px;

    border: 2px solid #67e8ff;
}

.scannerCorners::before {
    top: 0;
    left: 0;

    border-right: 0;
    border-bottom: 0;
}

.scannerCorners::after {
    top: 0;
    right: 0;

    border-left: 0;
    border-bottom: 0;
}

.faceBox {
    position: absolute;

    border: 1px solid #39ff88;

    box-shadow:
        0 0 10px rgba(57,255,136,.7),
        inset 0 0 15px rgba(57,255,136,.08);

    display: none;

    pointer-events: none;
}

.faceBox.active {
    display: block;
}

.faceMesh {
    position: absolute;

    pointer-events: none;

    display: none;
}

.faceMesh.active {
    display: block;
}

.meshPoint {
    position: absolute;

    width: 3px;
    height: 3px;

    background: #39ff88;

    border-radius: 50%;

    box-shadow:
        0 0 5px #39ff88;
}

.meshLine {
    position: absolute;

    height: 1px;

    background: rgba(57,255,136,.65);

    transform-origin: left center;
}

.scanLine {
    position: absolute;

    left: 0;
    right: 0;

    height: 2px;

    background: #39ff88;

    box-shadow:
        0 0 8px #39ff88,
        0 0 20px #39ff88;

    animation: scanLine 2.5s linear infinite;

    opacity: .7;
}

@keyframes scanLine {

    0% {
        top: 0;
    }

    50% {
        top: 100%;
    }

    100% {
        top: 0;
    }
}

.status {
    margin-top: 15px;

    font-size: 14px;

    letter-spacing: 5px;

    text-align: center;
}

.substatus {
    margin-top: 8px;

    font-size: 9px;

    letter-spacing: 3px;

    opacity: .45;

    text-align: center;
}

.faceButton {
    margin-top: 15px;

    padding: 12px 18px;

    border:
        1px solid rgba(70,220,255,.4);

    background:
        rgba(0,100,160,.12);

    color: #aeeeff;

    font-size: 9px;

    letter-spacing: 3px;

    cursor: pointer;
}

/* PANELS */

.panels {
    width: 100%;
    max-width: 900px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.panel {
    padding: 14px;

    border:
        1px solid rgba(80,210,255,.2);

    background:
        rgba(0,100,160,.06);
}

.panel-title {
    font-size: 8px;
    letter-spacing: 2px;
    opacity: .4;
}

.panel-value {
    margin-top: 10px;
    font-size: 11px;
}

/* CONSOLE */

#jarvisConsole {

    position: fixed;
    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,150,255,.18),
            #020810 65%
        );

    opacity: 0;

    pointer-events: none;

    transition: opacity .6s;
}

#jarvisConsole.open {

    opacity: 1;

    pointer-events: auto;
}

.consoleGrid {

    position: absolute;
    inset: 0;

    background-image:

        linear-gradient(
            rgba(50,190,255,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(50,190,255,.12) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .3;
}

.consoleWelcome {

    position: relative;

    font-size: 34px;

    letter-spacing: 7px;

    text-shadow:
        0 0 20px rgba(80,220,255,.7);
}

.consoleName {

    position: relative;

    margin-top: 10px;

    font-size: 15px;

    letter-spacing: 6px;
}

.consoleMessage {

    position: relative;

    margin-top: 35px;

    width: 80%;
    max-width: 650px;

    padding: 20px;

    border:
        1px solid rgba(80,210,255,.25);

    background:
        rgba(0,100,160,.08);

    text-align: center;

    font-size: 12px;

    letter-spacing: 2px;

    line-height: 1.8;
}

.jarvisButton {

    position: relative;

    margin-top: 12px;

    padding: 12px 20px;

    border:
        1px solid rgba(100,220,255,.4);

    background:
        rgba(0,100,160,.12);

    color: #aeeeff;

    font-size: 9px;

    letter-spacing: 3px;

    cursor: pointer;
}

/* MOBILE */

@media(max-width:700px) {

    .main {
        padding: 18px;
    }

    .faceScanner {
        width: min(300px, 90vw);
        height: 225px;
    }

    .panels {
        grid-template-columns: 1fr;
        gap: 7px;
    }

    .panel {
        padding: 9px;
    }

    .consoleWelcome {
        font-size: 25px;
    }
}

</style>
</head>

<body>

<div class="grid"></div>

<div class="main">

    <div class="header">

        <div>

            <div class="system">
                PERSONAL INTERFACE
            </div>

            <div class="logo">
                JARVIS // CORE
            </div>

        </div>

        <div class="clock">

            <div class="time" id="time">
                --:--
            </div>

            <div class="date" id="date">
                ---
            </div>

        </div>

    </div>

    <div class="center">

        <div class="faceScanner">

            <video
                id="camera"
                autoplay
                muted
                playsinline>
            </video>

            <div class="scannerCorners"></div>

            <div
                id="faceBox"
                class="faceBox">
            </div>

            <div
                id="faceMesh"
                class="faceMesh">
            </div>

            <div class="scanLine"></div>

        </div>

        <div
            id="systemStatus"
            class="status">

            INITIALIZING

        </div>

        <div
            id="systemSubstatus"
            class="substatus">

            LOADING FACE SYSTEM

        </div>

        <button
            id="setupFace"
            class="faceButton">

            SET UP FACE

        </button>

    </div>

    <div class="panels">

        <div class="panel">

            <div class="panel-title">
                CORE STATUS
            </div>

            <div class="panel-value">
                ONLINE
            </div>

        </div>

        <div class="panel">

            <div class="panel-title">
                SECURITY
            </div>

            <div class="panel-value"
                 id="securityStatus">

                FACE AUTHENTICATION

            </div>

        </div>

        <div class="panel">

            <div class="panel-title">
                SYSTEM
            </div>

            <div class="panel-value">
                ALL SYSTEMS NOMINAL
            </div>

        </div>

    </div>

</div>


<!-- CONSOLE -->

<div id="jarvisConsole">

    <div class="consoleGrid"></div>

    <div class="consoleWelcome">
        WELCOME BACK
    </div>

    <div class="consoleName">
        BLAKE
    </div>

    <div
        id="consoleMessage"
        class="consoleMessage">

        IDENTITY VERIFIED.
        JARVIS ONLINE.

    </div>

    <button
        id="openAI"
        class="jarvisButton">

        OPEN JARVIS AI

    </button>

    <button
        id="closeConsole"
        class="jarvisButton">

        RETURN TO SYSTEM

    </button>

</div>


<script>

/* CLOCK */

function updateClock() {

    const now = new Date();

    document.getElementById("time")
        .textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date")
        .textContent =
        now.toLocaleDateString([], {
            weekday: "long",
            month: "long",
            day: "numeric"
        }).toUpperCase();
}

updateClock();

setInterval(updateClock, 1000);


/* CAMERA */

const video =
    document.getElementById("camera");

const faceBox =
    document.getElementById("faceBox");

const faceMesh =
    document.getElementById("faceMesh");

const status =
    document.getElementById("systemStatus");

const substatus =
    document.getElementById("systemSubstatus");

const setupButton =
    document.getElementById("setupFace");

const securityStatus =
    document.getElementById("securityStatus");

let referenceDescriptor = null;

let scanning = false;

let lastAuthentication = 0;


/* LOAD FACE MODELS */

async function loadFaceSystem() {

    try {

        status.textContent =
            "LOADING";

        substatus.textContent =
            "LOADING FACE MODELS";

        await faceapi.nets.tinyFaceDetector.loadFromUri(
            "./models"
        );

        await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
            "./models"
        );

        status.textContent =
            "FACE SYSTEM READY";

        substatus.textContent =
            "LOOK AT THE CAMERA";

        startCamera();

    } catch (error) {

        console.error(error);

        status.textContent =
            "MODEL ERROR";

        substatus.textContent =
            "CHECK /models FOLDER";

    }

}


/* START CAMERA */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",
                    width: 640,
                    height: 480
                },

                audio: false

            });

        video.srcObject =
            stream;

        await video.play();

        detectFace();

    } catch (error) {

        console.error(error);

        status.textContent =
            "CAMERA ERROR";

        substatus.textContent =
            "CAMERA ACCESS REQUIRED";

    }

}


/* DRAW FACE MESH */

function drawMesh(points) {

    faceMesh.innerHTML = "";

    const box =
        faceBox.getBoundingClientRect();

    const scanner =
        document
            .querySelector(".faceScanner")
            .getBoundingClientRect();

    const scaleX =
        scanner.width / video.videoWidth;

    const scaleY =
        scanner.height / video.videoHeight;

    points.forEach(point => {

        const dot =
            document.createElement("div");

        dot.className =
            "meshPoint";

        dot.style.left =
            (point.x * scaleX) + "px";

        dot.style.top =
            (point.y * scaleY) + "px";

        faceMesh.appendChild(dot);

    });

    faceMesh.classList.add("active");
}


/* FACE DETECTION */

async function detectFace() {

    if (!video.videoWidth) {

        requestAnimationFrame(
            detectFace
        );

        return;

    }

    const detection =
        await faceapi
            .detectSingleFace(
                video,
                new faceapi.TinyFaceDetectorOptions({
                    inputSize: 320,
                    scoreThreshold: 0.35
                })
            )
            .withFaceLandmarks(true);

    if (!detection) {

        faceBox.classList.remove("active");
        faceMesh.classList.remove("active");

        status.textContent =
            "NO FACE FOUND";

        substatus.textContent =
            "LOOK AT THE CAMERA";

    } else {

        const box =
            detection.detection.box;

        const scaleX =
            document.querySelector(
                ".faceScanner"
            ).clientWidth /
            video.videoWidth;

        const scaleY =
            document.querySelector(
                ".faceScanner"
            ).clientHeight /
            video.videoHeight;

        faceBox.style.left =
            (box.x * scaleX) + "px";

        faceBox.style.top =
            (box.y * scaleY) + "px";

        faceBox.style.width =
            (box.width * scaleX) + "px";

        faceBox.style.height =
            (box.height * scaleY) + "px";

        faceBox.classList.add("active");

        drawMesh(
            detection.landmarks.positions
        );

        if (!scanning) {

            status.textContent =
                "FACE DETECTED";

            substatus.textContent =
                "ANALYZING IDENTITY";

            authenticate(
                detection
            );

        }

    }

    requestAnimationFrame(
        detectFace
    );
}


/* SAVE FACE */

setupButton.addEventListener(
    "click",
    async function() {

        if (!video.videoWidth) {
            return;
        }

        status.textContent =
            "CAPTURING";

        substatus.textContent =
            "HOLD STILL";

        const detection =
            await faceapi
                .detectSingleFace(
                    video,
                    new faceapi.TinyFaceDetectorOptions({
                        inputSize: 320,
                        scoreThreshold: 0.35
                    })
                )
                .withFaceLandmarks(true)
                .withFaceDescriptor();

        if (!detection) {

            status.textContent =
                "NO FACE FOUND";

            substatus.textContent =
                "TRY AGAIN";

            return;

        }

        referenceDescriptor =
            Array.from(
                detection.descriptor
            );

        localStorage.setItem(
            "jarvisFaceDescriptor",
            JSON.stringify(
                referenceDescriptor
            )
        );

        securityStatus.textContent =
            "FACE REGISTERED";

        status.textContent =
            "FACE SAVED";

        substatus.textContent =
            "JARVIS CAN NOW VERIFY YOU";

    }
);


/* LOAD SAVED FACE */

const savedFace =
    localStorage.getItem(
        "jarvisFaceDescriptor"
    );

if (savedFace) {

    try {

        referenceDescriptor =
            new Float32Array(
                JSON.parse(savedFace)
            );

        securityStatus.textContent =
            "FACE REGISTERED";

    } catch(error) {

        console.error(error);

    }

}


/* AUTHENTICATION */

async function authenticate(
    detection
) {

    if (
        !referenceDescriptor ||
        scanning ||
        Date.now() -
        lastAuthentication <
        4000
    ) {

        return;

    }

    lastAuthentication =
        Date.now();

    scanning = true;

    status.textContent =
        "SCANNING";

    substatus.textContent =
        "COMPARING IDENTITY";

    const fullDetection =
        await faceapi
            .detectSingleFace(
                video,
                new faceapi.TinyFaceDetectorOptions({
                    inputSize: 320,
                    scoreThreshold: 0.35
                })
            )
            .withFaceLandmarks(true)
            .withFaceDescriptor();

    if (!fullDetection) {

        scanning = false;
        return;

    }

    const distance =
        faceapi.euclideanDistance(
            referenceDescriptor,
            fullDetection.descriptor
        );

    console.log(
        "Face distance:",
        distance
    );

    /*
       Lower number = closer match.

       0.50 is intentionally conservative.
    */

    if (distance < 0.50) {

        status.textContent =
            "IDENTITY VERIFIED";

        substatus.textContent =
            "ACCESS AUTHORIZED";

        securityStatus.textContent =
            "BLAKE VERIFIED";

        setTimeout(
            openConsole,
            1200
        );

    } else {

        status.textContent =
            "ACCESS DENIED";

        substatus.textContent =
            "IDENTITY NOT RECOGNIZED";

        securityStatus.textContent =
            "UNKNOWN USER";

        setTimeout(() => {

            status.textContent =
                "FACE DETECTED";

            substatus.textContent =
                "ANALYZING IDENTITY";

            scanning = false;

        }, 2500);

    }

}


/* CONSOLE */

function openConsole() {

    document
        .getElementById(
            "jarvisConsole"
        )
        .classList
        .add("open");

    document
        .getElementById(
            "consoleMessage"
        )
        .textContent =
        "IDENTITY VERIFIED. JARVIS ONLINE.";

}


/* CLOSE */

document
    .getElementById(
        "closeConsole"
    )
    .addEventListener(
        "click",
        function() {

            document
                .getElementById(
                    "jarvisConsole"
                )
                .classList
                .remove("open");

            scanning = false;

        }
    );


/* START */

loadFaceSystem();

</script>

</body>
</html>
