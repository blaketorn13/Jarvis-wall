<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JARVIS</title>

<style>

html, body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #020810;

    color: #9eeaff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

* {
    box-sizing: border-box;
}

body {

    background:
        radial-gradient(
            circle at center,
            rgba(0,150,255,.20),
            rgba(0,40,70,.12) 35%,
            #020810 70%
        );
}


/* GRID */

.grid {

    position: fixed;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(50,190,255,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(50,190,255,.12) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

}


/* MAIN */

.main {

    position: relative;

    z-index: 2;

    width: 100%;
    height: 100%;

    padding: 25px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

}


/* HEADER */

.header {

    display: flex;

    justify-content:
        space-between;

}

.system {

    font-size: 10px;

    letter-spacing: 4px;

    opacity: .45;

}

.logo {

    margin-top: 7px;

    font-size: 24px;

    letter-spacing: 6px;

    text-shadow:
        0 0 15px
        rgba(80,220,255,.7);

}

.clock {

    text-align: right;

}

.time {

    font-size: 30px;

}

.date {

    font-size: 9px;

    letter-spacing: 2px;

    opacity: .4;

    margin-top: 5px;

}


/* CENTER */

.center {

    display: flex;

    flex-direction: column;

    align-items: center;

}


/* HUD */

.hud {

    position: relative;

    width: 300px;
    height: 300px;

    display: flex;

    justify-content: center;

    align-items: center;

}

.ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(90,220,255,.5);

}

.ring1 {

    width: 285px;
    height: 285px;

}

.ring2 {

    width: 230px;
    height: 230px;

    border-style: dashed;

    animation:
        rotate 14s linear infinite;

}

.ring3 {

    width: 175px;
    height: 175px;

    opacity: .7;

}

.ring4 {

    width: 120px;
    height: 120px;

    animation:
        pulse 2s infinite;

}


@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


@keyframes pulse {

    0%, 100% {

        transform: scale(.9);

        opacity: .4;

    }

    50% {

        transform: scale(1.08);

        opacity: 1;

    }

}


/* SCAN */

.scan {

    position: absolute;

    width: 220px;

    height: 2px;

    background: #d8faff;

    box-shadow:

        0 0 10px #58dcff,

        0 0 30px #009fe0;

    animation:
        scan 2.5s
        ease-in-out
        infinite;

}


@keyframes scan {

    0%, 100% {

        transform:
            translateY(-105px);

        opacity: .2;

    }

    50% {

        transform:
            translateY(105px);

        opacity: 1;

    }

}


/* CORE */

.core {

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 10px white,

        0 0 30px #28c8ff,

        0 0 65px #008bd0;

}


/* CORNERS */

.corner {

    position: absolute;

    width: 28px;
    height: 28px;

    border-color:
        #7de5ff;

    border-style:
        solid;

}

.tl {

    top: 5px;
    left: 5px;

    border-width:
        2px 0 0 2px;

}

.tr {

    top: 5px;
    right: 5px;

    border-width:
        2px 2px 0 0;

}

.bl {

    bottom: 5px;
    left: 5px;

    border-width:
        0 0 2px 2px;

}

.br {

    bottom: 5px;
    right: 5px;

    border-width:
        0 2px 2px 0;

}


/* STATUS */

.status {

    margin-top: 5px;

    font-size: 14px;

    letter-spacing: 5px;

}

.substatus {

    margin-top: 8px;

    font-size: 9px;

    letter-spacing: 3px;

    opacity: .4;

}


/* PANELS */

.panels {

    width: 100%;

    max-width: 900px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}

.panel {

    padding: 14px;

    border:
        1px solid
        rgba(80,210,255,.2);

    background:
        rgba(0,100,160,.06);

}

.panel-title {

    font-size: 8px;

    letter-spacing: 2px;

    opacity: .4;

}

.panel-value {

    margin-top: 10px;

    font-size: 11px;

    letter-spacing: 1px;

}

.dot {

    display: inline-block;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #bff6ff;

    box-shadow:
        0 0 10px #42d9ff;

    margin-right: 6px;

}


/* FOOTER */

.footer {

    display: flex;

    justify-content:
        space-between;

    font-size: 8px;

    letter-spacing: 2px;

    opacity: .3;

}


/* =========================
   JARVIS CONSOLE
========================= */

#jarvisConsole {

    position: fixed;

    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:

        radial-gradient(
            circle at center,
            rgba(0,150,255,.18),
            #020810 65%
        );

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .6s;

}


#jarvisConsole.open {

    opacity: 1;

    pointer-events: auto;

}


.consoleGrid {

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(50,190,255,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(50,190,255,.12) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .3;

}


.consoleCore {

    position: relative;

    width: 220px;
    height: 220px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.consoleRing {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(90,220,255,.6);

}


.ringA {

    width: 210px;
    height: 210px;

    animation:
        spinConsole
        12s linear infinite;

}


.ringB {

    width: 165px;
    height: 165px;

    border-style: dashed;

    animation:
        spinConsoleReverse
        8s linear infinite;

}


.ringC {

    width: 110px;
    height: 110px;

    animation:
        consolePulse
        2s infinite;

}


.consoleDot {

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 15px white,

        0 0 35px #22c8ff,

        0 0 60px #008bd0;

}


@keyframes spinConsole {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }

}


@keyframes spinConsoleReverse {

    from {
        transform:
            rotate(360deg);
    }

    to {
        transform:
            rotate(0deg);
    }

}


@keyframes consolePulse {

    0%, 100% {

        transform:
            scale(.9);

        opacity: .4;

    }

    50% {

        transform:
            scale(1.1);

        opacity: 1;

    }

}


.consoleStatus {

    position: relative;

    margin-top: 25px;

    font-size: 10px;

    letter-spacing: 5px;

    opacity: .5;

}


.consoleWelcome {

    position: relative;

    margin-top: 15px;

    font-size: 34px;

    letter-spacing: 7px;

    text-shadow:
        0 0 20px
        rgba(80,220,255,.7);

}


.consoleName {

    position: relative;

    margin-top: 10px;

    font-size: 15px;

    letter-spacing: 6px;

}


.consoleMessage {

    position: relative;

    margin-top: 35px;

    width: 80%;

    max-width: 650px;

    padding: 20px;

    border:
        1px solid
        rgba(80,210,255,.25);

    background:
        rgba(0,100,160,.08);

    text-align: center;

    font-size: 12px;

    letter-spacing: 2px;

    line-height: 1.8;

}


/* BUTTONS */

#enableVoice,
#closeConsole {

    position: relative;

    margin-top: 15px;

    padding: 12px 20px;

    border:
        1px solid
        rgba(100,220,255,.4);

    background:
        rgba(0,100,160,.12);

    color:
        #aeeeff;

    font-size: 9px;

    letter-spacing: 3px;

    cursor: pointer;

}


#closeConsole {

    margin-top: 10px;

}


/* MOBILE */

@media(max-width:700px) {

    .main {

        padding: 18px;

    }

    .hud {

        transform:
            scale(.8);

    }

    .panels {

        grid-template-columns:
            1fr;

        gap: 7px;

    }

    .panel {

        padding: 9px;

    }

}

</style>

</head>


<body>


<div class="grid"></div>


<!-- MAIN HUD -->

<div class="main">


    <div class="header">


        <div>

            <div class="system">
                PERSONAL INTERFACE
            </div>

            <div class="logo">
                JARVIS // CORE
            </div>

        </div>


        <div class="clock">

            <div
                class="time"
                id="time">
                --:--
            </div>

            <div
                class="date"
                id="date">
                ---
            </div>

        </div>


    </div>


    <div class="center">


        <div class="hud">

            <div class="ring ring1"></div>

            <div class="ring ring2"></div>

            <div class="ring ring3"></div>

            <div class="ring ring4"></div>


            <div class="corner tl"></div>

            <div class="corner tr"></div>

            <div class="corner bl"></div>

            <div class="corner br"></div>


            <div class="scan"></div>

            <div class="core"></div>

        </div>


        <div class="status">
            SYSTEM READY
        </div>


        <div class="substatus">
            MONITORING ENVIRONMENT
        </div>


    </div>


    <div class="panels">


        <div class="panel">

            <div class="panel-title">
                CORE STATUS
            </div>

            <div class="panel-value">

                <span class="dot"></span>

                ONLINE

            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                SECURITY
            </div>

            <div class="panel-value">
                AUTHENTICATION READY
            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                SYSTEM
            </div>

            <div class="panel-value">
                ALL SYSTEMS NOMINAL
            </div>

        </div>


    </div>


    <div class="footer">

        <div>
            JARVIS CORE 01
        </div>

        <div>
            LOCAL SYSTEM
        </div>

        <div>
            ONLINE
        </div>

    </div>


</div>


<!-- JARVIS CONSOLE -->

<div id="jarvisConsole">


    <div class="consoleGrid"></div>


    <div class="consoleCore">

        <div class="consoleRing ringA"></div>

        <div class="consoleRing ringB"></div>

        <div class="consoleRing ringC"></div>

        <div class="consoleDot"></div>

    </div>


    <div class="consoleStatus">
        IDENTITY VERIFIED
    </div>


    <div class="consoleWelcome">
        WELCOME BACK
    </div>


    <div class="consoleName">
        BLAKE
    </div>


    <div
        class="consoleMessage"
        id="consoleMessage">

        INITIALIZING JARVIS...

    </div>


    <button id="enableVoice">
        ENABLE JARVIS VOICE
    </button>


    <button id="closeConsole">
        RETURN TO SYSTEM
    </button>


</div>


<script>


/* =========================
   CLOCK
========================= */

function updateClock() {

    const now =
        new Date();


    document
        .getElementById("time")
        .textContent =

        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    document
        .getElementById("date")
        .textContent =

        now.toLocaleDateString(
            [],
            {
                weekday: "long",
                month: "long",
                day: "numeric"
            }
        ).toUpperCase();

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =========================
   CAMERA
========================= */

const video =
    document.createElement(
        "video"
    );


video.setAttribute(
    "playsinline",
    ""
);


video.muted = true;


const canvas =
    document.createElement(
        "canvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let previous = null;

let scanning = false;

let lastScan = 0;


/* START CAMERA */

async function startCamera() {

    try {

        const stream =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user",

                        width: 320,

                        height: 240

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        canvas.width =
            64;

        canvas.height =
            48;


        setTimeout(
            checkMotion,
            1000
        );


    }

    catch(error) {

        console.log(
            "Camera error:",
            error
        );

    }

}


/* MOTION */

function checkMotion() {

    if (!video.videoWidth) {

        setTimeout(
            checkMotion,
            500
        );

        return;

    }


    ctx.drawImage(
        video,
        0,
        0,
        64,
        48
    );


    const frame =
        ctx.getImageData(
            0,
            0,
            64,
            48
        );


    if (previous) {

        let difference =
            0;


        for (

            let i = 0;

            i < frame.data.length;

            i += 16

        ) {

            difference +=

                Math.abs(
                    frame.data[i] -
                    previous.data[i]
                );

        }


        difference /=

            frame.data.length /
            16;


        if (

            difference > 10 &&

            !scanning &&

            Date.now() -
            lastScan > 10000

        ) {

            lastScan =
                Date.now();


            runScan();

        }

    }


    previous =
        frame;


    setTimeout(
        checkMotion,
        400
    );

}


/* =========================
   SCAN
========================= */

function runScan() {

    scanning =
        true;


    const status =
        document.querySelector(
            ".status"
        );


    const sub =
        document.querySelector(
            ".substatus"
        );


    status.textContent =
        "MOTION DETECTED";


    sub.textContent =
        "ANALYZING SUBJECT";


    setTimeout(() => {

        status.textContent =
            "SCANNING...";

        sub.textContent =
            "IDENTITY ANALYSIS";

    }, 2000);


    setTimeout(() => {

        status.textContent =
            "IDENTITY VERIFIED";

        sub.textContent =
            "ACCESS AUTHORIZED";

    }, 5000);


    setTimeout(() => {

        openConsole();

    }, 7000);

}


/* =========================
   CONSOLE
========================= */

function openConsole() {

    const screen =
        document.getElementById(
            "jarvisConsole"
        );


    const message =
        document.getElementById(
            "consoleMessage"
        );


    screen.classList.add(
        "open"
    );


    message.textContent =
        "JARVIS ONLINE. ALL SYSTEMS ARE OPERATIONAL.";


    if (voiceEnabled) {

        speak(
            "Welcome back, Blake. All systems are operational."
        );

    }

}


/* =========================
   VOICE SYSTEM
========================= */

let voiceEnabled =
    false;

let jarvisVoice =
    null;


/*
   Find the voices available
   on this iPad.
*/

function loadJarvisVoice() {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    const voices =
        window.speechSynthesis
            .getVoices();


    if (!voices.length) {

        return;

    }


    /*
       Prefer a deeper voice
       when one is available.
    */

    const preferred = [

        "Daniel",
        "Alex",
        "Fred",
        "Oliver",
        "Arthur"

    ];


    jarvisVoice = null;


    for (
        const name
        of preferred
    ) {

        const found =
            voices.find(
                voice =>
                    voice.name
                        .toLowerCase()
                        .includes(
                            name.toLowerCase()
                        )
            );


        if (found) {

            jarvisVoice =
                found;

            break;

        }

    }


    /*
       Otherwise use an
       English voice.
    */

    if (!jarvisVoice) {

        jarvisVoice =
            voices.find(
                voice =>
                    voice.lang
                        .toLowerCase()
                        .startsWith("en")
            );

    }


    /*
       Final fallback.
    */

    if (!jarvisVoice) {

        jarvisVoice =
            voices[0];

    }

}


/*
   iPad/Safari may load voices
   after the page starts.
*/

loadJarvisVoice();


if (
    "onvoiceschanged"
    in window.speechSynthesis
) {

    window.speechSynthesis
        .onvoiceschanged =
        loadJarvisVoice;

}


/* ENABLE VOICE */

function enableVoice() {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Speech is not supported on this device."
        );

        return;

    }


    loadJarvisVoice();


    const test =
        new SpeechSynthesisUtterance(
            "JARVIS voice online."
        );


    if (jarvisVoice) {

        test.voice =
            jarvisVoice;

    }


    test.lang =
        "en-US";


    test.rate =
        0.82;


    test.pitch =
        0.72;


    test.volume =
        1;


    window.speechSynthesis.cancel();


    window.speechSynthesis.speak(
        test
    );


    voiceEnabled =
        true;


    document
        .getElementById(
            "enableVoice"
        )
        .textContent =
        "JARVIS VOICE ONLINE";

}


/* SPEAK */

function speak(text) {

    if (
        !voiceEnabled ||
        !("speechSynthesis" in window)
    ) {

        return;

    }


    loadJarvisVoice();


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    if (jarvisVoice) {

        utterance.voice =
            jarvisVoice;

    }


    utterance.lang =
        "en-US";


    utterance.rate =
        0.82;


    utterance.pitch =
        0.72;


    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );

}


/* VOICE BUTTON */

document
    .getElementById(
        "enableVoice"
    )
    .addEventListener(
        "click",
        enableVoice
    );


/* RETURN BUTTON */

document
    .getElementById(
        "closeConsole"
    )
    .addEventListener(
        "click",
        function() {


            document
                .getElementById(
                    "jarvisConsole"
                )
                .classList.remove(
                    "open"
                );


            document
                .querySelector(
                    ".status"
                )
                .textContent =
                "SYSTEM READY";


            document
                .querySelector(
                    ".substatus"
                )
                .textContent =
                "MONITORING ENVIRONMENT";


            scanning =
                false;


        }
    );


/* START */

startCamera();

</script>


</body>

</html>
