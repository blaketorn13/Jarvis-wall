<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<!-- MediaPipe Face Mesh -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020810;
    color:#aeeeff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:radial-gradient(circle at center,rgba(0,150,255,.20),#020810 70%);
}

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(50,190,255,.10) 1px,transparent 1px),
        linear-gradient(90deg,rgba(50,190,255,.10) 1px,transparent 1px);
    background-size:45px 45px;
}

.main{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.header{
    display:flex;
    justify-content:space-between;
}

.system{
    font-size:10px;
    letter-spacing:4px;
    opacity:.45;
}

.logo{
    margin-top:7px;
    font-size:24px;
    letter-spacing:6px;
    text-shadow:0 0 15px rgba(80,220,255,.7);
}

.clock{text-align:right}
.time{font-size:30px}

.date{
    margin-top:5px;
    font-size:9px;
    letter-spacing:2px;
    opacity:.4;
}

.center{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* =========================
   FACE SCANNER
========================= */

.faceScanner{
    position:relative;
    width:250px;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#010b12;
    border:1px solid rgba(90,220,255,.5);
    box-shadow:
        0 0 20px rgba(0,170,255,.15),
        inset 0 0 30px rgba(0,170,255,.08);
}

/* Camera image */
#cameraVideo{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    opacity:.75;
}

/* Face mesh canvas */
#faceCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:scaleX(-1);
    pointer-events:none;
}

/* Scanner corners */
.scannerCorner{
    position:absolute;
    width:25px;
    height:25px;
    border:2px solid #7de5ff;
    z-index:5;
}

.scannerTL{
    top:6px;
    left:6px;
    border-right:0;
    border-bottom:0;
}

.scannerTR{
    top:6px;
    right:6px;
    border-left:0;
    border-bottom:0;
}

.scannerBL{
    bottom:6px;
    left:6px;
    border-right:0;
    border-top:0;
}

.scannerBR{
    bottom:6px;
    right:6px;
    border-left:0;
    border-top:0;
}

/* Thin scanning line */
.faceScanLine{
    position:absolute;
    left:8px;
    right:8px;
    height:2px;
    background:#57ff91;
    box-shadow:
        0 0 8px #57ff91,
        0 0 20px #00ff66;
    opacity:.7;
    animation:faceScan 2.5s ease-in-out infinite;
    z-index:6;
}

@keyframes faceScan{
    0%,100%{top:12%;opacity:.2}
    50%{top:88%;opacity:1}
}

/* Green face detection glow */
.faceDetected{
    box-shadow:
        0 0 15px rgba(50,255,120,.35),
        0 0 40px rgba(50,255,120,.15),
        inset 0 0 25px rgba(50,255,120,.12);
}

.status{
    margin-top:12px;
    font-size:14px;
    letter-spacing:5px;
}

.substatus{
    margin-top:8px;
    font-size:9px;
    letter-spacing:3px;
    opacity:.4;
}

.panels{
    width:100%;
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.panel{
    padding:14px;
    border:1px solid rgba(80,210,255,.2);
    background:rgba(0,100,160,.06);
}

.panel-title{
    font-size:8px;
    letter-spacing:2px;
    opacity:.4;
}

.panel-value{
    margin-top:10px;
    font-size:11px;
}

/* =========================
   WELCOME SCREEN
========================= */

#jarvisConsole{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at center,rgba(0,150,255,.18),#020810 65%);
    opacity:0;
    pointer-events:none;
    transition:opacity .6s;
}

#jarvisConsole.open{
    opacity:1;
    pointer-events:auto;
}

.consoleGrid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(50,190,255,.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(50,190,255,.12) 1px,transparent 1px);
    background-size:45px 45px;
    opacity:.3;
}

.consoleCore{
    position:relative;
    width:220px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.consoleRing{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(90,220,255,.6);
}

.ringA{
    width:210px;
    height:210px;
    animation:spin 12s linear infinite;
}

.ringB{
    width:165px;
    height:165px;
    border-style:dashed;
    animation:spinReverse 8s linear infinite;
}

.ringC{
    width:110px;
    height:110px;
    animation:pulse 2s infinite;
}

.consoleDot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 15px white,0 0 35px #22c8ff,0 0 60px #008bd0;
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes spinReverse{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
}

@keyframes pulse{
    0%,100%{transform:scale(.9);opacity:.4}
    50%{transform:scale(1.08);opacity:1}
}

.consoleStatus{
    position:relative;
    margin-top:25px;
    font-size:10px;
    letter-spacing:5px;
    opacity:.5;
}

.consoleWelcome{
    position:relative;
    margin-top:15px;
    font-size:34px;
    letter-spacing:7px;
    text-shadow:0 0 20px rgba(80,220,255,.7);
}

.consoleName{
    position:relative;
    margin-top:10px;
    font-size:15px;
    letter-spacing:6px;
}

.consoleMessage{
    position:relative;
    margin-top:35px;
    width:80%;
    max-width:650px;
    padding:20px;
    border:1px solid rgba(80,210,255,.25);
    background:rgba(0,100,160,.08);
    text-align:center;
    font-size:12px;
    letter-spacing:2px;
    line-height:1.8;
}

.jarvisButton{
    position:relative;
    margin-top:12px;
    padding:12px 20px;
    border:1px solid rgba(100,220,255,.4);
    background:rgba(0,100,160,.12);
    color:#aeeeff;
    font-size:9px;
    letter-spacing:3px;
    cursor:pointer;
}

/* =========================
   AI SCREEN
========================= */

#aiScreen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:radial-gradient(circle at center,rgba(0,150,255,.18),#020810 70%);
    opacity:0;
    pointer-events:none;
    transition:opacity .5s;
    padding:25px;
}

#aiScreen.open{
    opacity:1;
    pointer-events:auto;
}

.aiGrid{
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(rgba(50,190,255,.10) 1px,transparent 1px),
        linear-gradient(90deg,rgba(50,190,255,.10) 1px,transparent 1px);
    background-size:45px 45px;
}

.aiHeader{
    position:relative;
    z-index:2;
    width:100%;
    display:flex;
    justify-content:space-between;
}

.aiSmall{
    font-size:9px;
    letter-spacing:3px;
    opacity:.4;
}

.aiTitle{
    margin-top:5px;
    font-size:28px;
    letter-spacing:6px;
    text-shadow:0 0 20px rgba(70,220,255,.7);
}

.aiStatus{
    font-size:9px;
    letter-spacing:3px;
}

.aiOrb{
    position:relative;
    width:210px;
    height:210px;
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.aiRing{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(70,210,255,.5);
}

.aiRing1{
    width:200px;
    height:200px;
    animation:spin 12s linear infinite;
}

.aiRing2{
    width:155px;
    height:155px;
    border-style:dashed;
    animation:spinReverse 8s linear infinite;
}

.aiRing3{
    width:105px;
    height:105px;
    animation:pulse 2s infinite;
}

.aiCore{
    width:20px;
    height:20px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 15px white,0 0 35px #21caff,0 0 70px #008bd0;
}

.aiMessages{
    position:relative;
    z-index:2;
    width:100%;
    max-width:700px;
    flex:1;
    overflow-y:auto;
    padding:10px 5px;
}

.aiMessage{
    padding:13px 16px;
    margin-bottom:12px;
    border:1px solid rgba(70,210,255,.2);
    background:rgba(0,100,160,.08);
    font-size:12px;
    line-height:1.6;
}

.jarvisMessage{
    border-left:2px solid #5edcff;
}

.userMessage{
    border-right:2px solid #5edcff;
    text-align:right;
}

.aiInputArea{
    position:relative;
    z-index:2;
    width:100%;
    max-width:700px;
    display:flex;
    gap:8px;
}

#aiInput{
    flex:1;
    padding:15px;
    border:1px solid rgba(70,210,255,.3);
    outline:none;
    background:rgba(0,50,80,.5);
    color:#bdf2ff;
    font-size:12px;
}

#aiInput::placeholder{
    color:rgba(160,230,255,.4);
}

#aiSend,#aiMic,#aiBack{
    border:1px solid rgba(70,210,255,.35);
    background:rgba(0,100,160,.12);
    color:#aeeeff;
    cursor:pointer;
    letter-spacing:2px;
}

#aiSend,#aiMic{
    padding:0 16px;
}

#aiBack{
    position:relative;
    z-index:2;
    margin-top:12px;
    margin-bottom:10px;
    padding:10px 20px;
    font-size:9px;
}

@media(max-width:700px){
    .main{padding:18px}

    .faceScanner{
        width:230px;
        height:175px;
    }

    .panels{
        grid-template-columns:1fr;
        gap:7px;
    }

    .panel{padding:9px}

    .consoleWelcome{font-size:25px}
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="main">

    <div class="header">

        <div>
            <div class="system">PERSONAL INTERFACE</div>
            <div class="logo">JARVIS // CORE</div>
        </div>

        <div class="clock">
            <div class="time" id="time">--:--</div>
            <div class="date" id="date">---</div>
        </div>

    </div>

    <div class="center">

        <!-- SMALL CAMERA / FACE SCANNER -->
        <div class="faceScanner" id="faceScanner">

            <video id="cameraVideo" autoplay playsinline muted></video>

            <canvas id="faceCanvas"></canvas>

            <div class="scannerCorner scannerTL"></div>
            <div class="scannerCorner scannerTR"></div>
            <div class="scannerCorner scannerBL"></div>
            <div class="scannerCorner scannerBR"></div>

            <div class="faceScanLine"></div>

        </div>

        <div class="status" id="systemStatus">
            SYSTEM READY
        </div>

        <div class="substatus" id="systemSubstatus">
            MONITORING ENVIRONMENT
        </div>

    </div>

    <div class="panels">

        <div class="panel">
            <div class="panel-title">CORE STATUS</div>
            <div class="panel-value">ONLINE</div>
        </div>

        <div class="panel">
            <div class="panel-title">SECURITY</div>
            <div class="panel-value">AUTHENTICATION READY</div>
        </div>

        <div class="panel">
            <div class="panel-title">SYSTEM</div>
            <div class="panel-value">ALL SYSTEMS NOMINAL</div>
        </div>

    </div>

</div>

<!-- WELCOME SCREEN -->

<div id="jarvisConsole">

    <div class="consoleGrid"></div>

    <div class="consoleCore">
        <div class="consoleRing ringA"></div>
        <div class="consoleRing ringB"></div>
        <div class="consoleRing ringC"></div>
        <div class="consoleDot"></div>
    </div>

    <div class="consoleStatus">IDENTITY VERIFIED</div>

    <div class="consoleWelcome">WELCOME BACK</div>

    <div class="consoleName">BLAKE</div>

    <div class="consoleMessage" id="consoleMessage">
        JARVIS INITIALIZING...
    </div>

    <button class="jarvisButton" id="enableVoice">
        ENABLE JARVIS VOICE
    </button>

    <button class="jarvisButton" id="openAI">
        OPEN JARVIS AI
    </button>

    <button class="jarvisButton" id="closeConsole">
        RETURN TO SYSTEM
    </button>

</div>

<!-- AI SCREEN -->

<div id="aiScreen">

    <div class="aiGrid"></div>

    <div class="aiHeader">

        <div>
            <div class="aiSmall">JARVIS ARTIFICIAL INTELLIGENCE</div>
            <div class="aiTitle">AI CORE</div>
        </div>

        <div id="aiStatus" class="aiStatus">
            ONLINE
        </div>

    </div>

    <div class="aiOrb">

        <div class="aiRing aiRing1"></div>
        <div class="aiRing aiRing2"></div>
        <div class="aiRing aiRing3"></div>
        <div class="aiCore"></div>

    </div>

    <div id="aiMessages" class="aiMessages">

        <div class="aiMessage jarvisMessage">
            JARVIS ONLINE. HOW CAN I HELP?
        </div>

    </div>

    <div class="aiInputArea">

        <input
            id="aiInput"
            type="text"
            placeholder="Talk to JARVIS..."
            autocomplete="off"
        >

        <button id="aiSend">SEND</button>

        <button id="aiMic">🎙</button>

    </div>

    <button id="aiBack">
        RETURN TO JARVIS
    </button>

</div>

<script>

/* =========================
   CLOCK
========================= */

function updateClock(){

    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString([],{
            weekday:"long",
            month:"long",
            day:"numeric"
        }).toUpperCase();
}

updateClock();
setInterval(updateClock,1000);


/* =========================
   CAMERA + FACE MESH
========================= */

const video =
    document.getElementById("cameraVideo");

const faceCanvas =
    document.getElementById("faceCanvas");

const faceCtx =
    faceCanvas.getContext("2d");

const faceScanner =
    document.getElementById("faceScanner");

const status =
    document.getElementById("systemStatus");

const substatus =
    document.getElementById("systemSubstatus");

let faceDetected = false;
let scanning = false;
let lastScan = 0;


/* Green facial mesh */

function drawFaceMesh(landmarks){

    faceCtx.clearRect(
        0,
        0,
        faceCanvas.width,
        faceCanvas.height
    );

    if(!landmarks) return;

    const w = faceCanvas.width;
    const h = faceCanvas.height;

    faceCtx.strokeStyle =
        "rgba(60,255,120,.85)";

    faceCtx.fillStyle =
        "rgba(60,255,120,.85)";

    faceCtx.lineWidth = 0.8;

    /*
       Draw facial landmark connections.
       The landmarks themselves create the
       green mesh effect over the detected face.
    */

    const connections = [
        [10,338],[338,297],[297,332],[332,284],
        [284,251],[251,389],[389,356],[356,454],
        [454,323],[323,361],[361,288],[288,397],
        [397,365],[365,379],[379,378],[378,400],
        [400,377],[377,152],[152,148],[148,176],
        [176,149],[149,150],[150,136],[136,172],
        [172,58],[58,132],[132,93],[93,234],
        [234,127],[127,162],[162,21],[21,54],
        [54,103],[103,67],[67,109],[109,10],

        [33,7],[7,163],[163,144],[144,145],
        [145,153],[153,154],[154,155],[155,133],
        [133,173],[173,157],[157,158],[158,159],
        [159,160],[160,161],[161,246],

        [263,249],[249,390],[390,373],[373,374],
        [374,380],[380,381],[381,382],[382,362],
        [362,398],[398,384],[384,385],[385,386],
        [386,387],[387,388],[388,466]
    ];

    connections.forEach(pair=>{

        const a = landmarks[pair[0]];
        const b = landmarks[pair[1]];

        if(!a || !b) return;

        faceCtx.beginPath();

        faceCtx.moveTo(
            a.x * w,
            a.y * h
        );

        faceCtx.lineTo(
            b.x * w,
            b.y * h
        );

        faceCtx.stroke();

    });


    /* Landmark points */

    landmarks.forEach(point=>{

        faceCtx.beginPath();

        faceCtx.arc(
            point.x * w,
            point.y * h,
            1.1,
            0,
            Math.PI * 2
        );

        faceCtx.fill();

    });


    /* Face targeting box */

    const xs = landmarks.map(p=>p.x*w);
    const ys = landmarks.map(p=>p.y*h);

    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);

    faceCtx.strokeStyle =
        "rgba(80,255,130,.55)";

    faceCtx.lineWidth = 1;

    faceCtx.strokeRect(
        minX - 5,
        minY - 5,
        maxX-minX+10,
        maxY-minY+10
    );
}


/* MediaPipe */

const faceMesh =
    new FaceMesh({
        locateFile:file=>{
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }
    });


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:.5,

    minTrackingConfidence:.5

});


faceMesh.onResults(results=>{

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        faceDetected = false;

        faceScanner.classList.remove(
            "faceDetected"
        );

        faceCtx.clearRect(
            0,
            0,
            faceCanvas.width,
            faceCanvas.height
        );

        status.textContent =
            "SYSTEM READY";

        substatus.textContent =
            "SEARCHING FOR FACE";

        return;

    }


    faceDetected = true;

    faceScanner.classList.add(
        "faceDetected"
    );

    drawFaceMesh(
        results.multiFaceLandmarks[0]
    );


    if(
        !scanning &&
        Date.now()-lastScan > 10000
    ){

        runFaceScan();

    }

});


/* Start camera */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false

            });

        video.srcObject = stream;

        await video.play();

        faceCanvas.width =
            video.videoWidth || 640;

        faceCanvas.height =
            video.videoHeight || 480;

        processCamera();

    }catch(error){

        console.error(
            "Camera error:",
            error
        );

        status.textContent =
            "CAMERA ERROR";

        substatus.textContent =
            "CAMERA ACCESS REQUIRED";

    }

}


/* Continuously process camera */

async function processCamera(){

    if(
        video.readyState >= 2 &&
        !video.paused
    ){

        try{

            await faceMesh.send({
                image:video
            });

        }catch(error){

            console.error(error);

        }

    }

    requestAnimationFrame(
        processCamera
    );

}


/* =========================
   FACE SCAN
========================= */

function runFaceScan(){

    scanning = true;

    lastScan = Date.now();

    status.textContent =
        "FACE DETECTED";

    substatus.textContent =
        "LOCKING SUBJECT";

    setTimeout(()=>{

        if(!faceDetected) return;

        status.textContent =
            "SCANNING...";

        substatus.textContent =
            "ANALYZING FACIAL FEATURES";

    },1200);


    setTimeout(()=>{

        if(!faceDetected) return;

        status.textContent =
            "IDENTITY VERIFIED";

        substatus.textContent =
            "ACCESS AUTHORIZED";

    },3500);


    setTimeout(()=>{

        if(faceDetected){

            openConsole();

        }else{

            scanning = false;

        }

    },5000);

}


/* =========================
   VOICE
========================= */

let voiceEnabled = false;
let jarvisVoice = null;

function loadJarvisVoice(){

    if(!("speechSynthesis" in window))
        return;

    const voices =
        speechSynthesis.getVoices();

    if(!voices.length)
        return;

    const preferred=[
        "Daniel",
        "Alex",
        "Fred",
        "Oliver",
        "Arthur"
    ];

    for(const name of preferred){

        const found =
            voices.find(
                voice =>
                    voice.name
                    .toLowerCase()
                    .includes(
                        name.toLowerCase()
                    )
            );

        if(found){

            jarvisVoice=found;
            break;

        }

    }

    if(!jarvisVoice){

        jarvisVoice =
            voices.find(
                voice =>
                    voice.lang
                    .toLowerCase()
                    .startsWith("en")
            );

    }

}

loadJarvisVoice();

if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
        loadJarvisVoice;

}


function speak(text){

    if(
        !voiceEnabled ||
        !("speechSynthesis" in window)
    ) return;

    loadJarvisVoice();

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    if(jarvisVoice)
        utterance.voice=jarvisVoice;

    utterance.rate=.82;
    utterance.pitch=.72;
    utterance.volume=1;

    speechSynthesis.speak(
        utterance
    );

}


/* Enable voice */

document
.getElementById("enableVoice")
.addEventListener("click",function(){

    voiceEnabled=true;

    speak(
        "JARVIS voice online."
    );

    this.textContent =
        "JARVIS VOICE ONLINE";

});


/* =========================
   WELCOME SCREEN
========================= */

function openConsole(){

    document
    .getElementById("jarvisConsole")
    .classList.add("open");

    document
    .getElementById("consoleMessage")
    .textContent =
        "JARVIS ONLINE. ALL SYSTEMS ARE OPERATIONAL.";

    if(voiceEnabled){

        speak(
            "Welcome back, Blake. All systems are operational."
        );

    }

}


document
.getElementById("closeConsole")
.addEventListener("click",function(){

    document
    .getElementById("jarvisConsole")
    .classList.remove("open");

    status.textContent =
        "SYSTEM READY";

    substatus.textContent =
        "MONITORING ENVIRONMENT";

    scanning=false;

    lastScan=Date.now();

});


/* =========================
   AI
========================= */

const aiScreen =
    document.getElementById("aiScreen");

const aiInput =
    document.getElementById("aiInput");

const aiMessages =
    document.getElementById("aiMessages");

const aiStatus =
    document.getElementById("aiStatus");


function addMessage(text,isUser){

    const message =
        document.createElement("div");

    message.className =
        isUser
        ? "aiMessage userMessage"
        : "aiMessage jarvisMessage";

    message.textContent=text;

    aiMessages.appendChild(
        message
    );

    aiMessages.scrollTop =
        aiMessages.scrollHeight;

}


/* AI REQUEST */

async function sendMessage(){

    const text =
        aiInput.value.trim();

    if(!text)
        return;

    addMessage(text,true);

    aiInput.value="";

    aiStatus.textContent =
        "THINKING...";

    try{

        const response =
            await fetch(
                "https://jarvis-wall-two.vercel.app/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:text
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "AI request failed"
            );

        }

        addMessage(
            data.reply,
            false
        );

        speak(data.reply);

        aiStatus.textContent =
            "ONLINE";

    }catch(error){

        console.error(error);

        addMessage(
            "I couldn't connect to my AI core. Check the backend connection.",
            false
        );

        aiStatus.textContent =
            "CONNECTION ERROR";

    }

}


/* Open AI */

document
.getElementById("openAI")
.addEventListener("click",function(){

    aiScreen.classList.add("open");

    aiInput.focus();

});


/* Back */

document
.getElementById("aiBack")
.addEventListener("click",function(){

    aiScreen.classList.remove("open");

});


/* Send */

document
.getElementById("aiSend")
.addEventListener(
    "click",
    sendMessage
);


/* Enter */

aiInput.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter")
            sendMessage();

    }
);


/* =========================
   MICROPHONE
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    const recognition =
        new SpeechRecognition();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    document
    .getElementById("aiMic")
    .addEventListener("click",function(){

        aiStatus.textContent =
            "LISTENING...";

        recognition.start();

    });


    recognition.onresult =
        function(event){

            aiInput.value =
                event
                .results[0][0]
                .transcript;

            sendMessage();

        };


    recognition.onerror =
        function(){

            aiStatus.textContent =
                "ONLINE";

        };

}


/* =========================
   START
========================= */

startCamera();
