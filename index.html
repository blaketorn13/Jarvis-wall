<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020810;
    color: #aeeeff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(circle at center,
        rgba(0,150,255,.20),
        #020810 70%);
}

.grid {
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(50,190,255,.10) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(50,190,255,.10) 1px,
            transparent 1px
        );

    background-size: 45px 45px;
}

.main {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 100%;

    padding: 22px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.header {
    display: flex;
    justify-content: space-between;
}

.system {
    font-size: 10px;
    letter-spacing: 4px;
    opacity: .45;
}

.logo {
    margin-top: 7px;
    font-size: 24px;
    letter-spacing: 6px;

    text-shadow:
        0 0 15px rgba(80,220,255,.7);
}

.clock {
    text-align: right;
}

.time {
    font-size: 30px;
}

.date {
    margin-top: 5px;
    font-size: 9px;
    letter-spacing: 2px;
    opacity: .4;
}

/* CAMERA */

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.cameraBox {
    position: relative;

    width: min(320px, 88vw);
    height: 240px;

    overflow: hidden;

    border:
        1px solid rgba(80,220,255,.7);

    background: #000;

    box-shadow:
        0 0 25px rgba(0,180,255,.18),
        inset 0 0 30px rgba(0,180,255,.08);
}

#camera {
    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);
}

.corner {
    position: absolute;

    width: 28px;
    height: 28px;

    border: 2px solid #7de5ff;

    z-index: 5;
}

.tl {
    top: 8px;
    left: 8px;

    border-right: 0;
    border-bottom: 0;
}

.tr {
    top: 8px;
    right: 8px;

    border-left: 0;
    border-bottom: 0;
}

.bl {
    bottom: 8px;
    left: 8px;

    border-right: 0;
    border-top: 0;
}

.br {
    bottom: 8px;
    right: 8px;

    border-left: 0;
    border-top: 0;
}

#faceCanvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    transform: scaleX(-1);

    z-index: 4;

    pointer-events: none;
}

.scanLine {
    position: absolute;

    left: 0;
    right: 0;

    height: 2px;

    background: #39ff88;

    box-shadow:
        0 0 8px #39ff88,
        0 0 20px #39ff88;

    opacity: .65;

    animation:
        scan 2.5s linear infinite;

    z-index: 6;
}

@keyframes scan {
    0% {
        top: 0;
    }

    50% {
        top: 100%;
    }

    100% {
        top: 0;
    }
}

.status {
    margin-top: 15px;

    font-size: 14px;

    letter-spacing: 4px;

    text-align: center;
}

.substatus {
    margin-top: 7px;

    font-size: 9px;

    letter-spacing: 3px;

    opacity: .45;

    text-align: center;
}

.faceButton {
    margin-top: 14px;

    padding: 11px 18px;

    border:
        1px solid rgba(80,220,255,.4);

    background:
        rgba(0,100,160,.12);

    color: #aeeeff;

    cursor: pointer;

    font-size: 9px;

    letter-spacing: 3px;
}

/* PANELS */

.panels {
    width: 100%;
    max-width: 900px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

.panel {
    padding: 12px;

    border:
        1px solid rgba(80,210,255,.2);

    background:
        rgba(0,100,160,.06);
}

.panel-title {
    font-size: 8px;
    letter-spacing: 2px;
    opacity: .4;
}

.panel-value {
    margin-top: 8px;
    font-size: 10px;
}

/* CONSOLE */

#jarvisConsole {
    position: fixed;
    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,150,255,.18),
            #020810 65%
        );

    opacity: 0;

    pointer-events: none;

    transition: opacity .5s;
}

#jarvisConsole.open {
    opacity: 1;
    pointer-events: auto;
}

.consoleWelcome {
    font-size: 32px;

    letter-spacing: 7px;

    text-shadow:
        0 0 20px rgba(80,220,255,.7);
}

.consoleName {
    margin-top: 10px;

    font-size: 15px;

    letter-spacing: 6px;
}

.consoleMessage {
    margin-top: 30px;

    width: 80%;
    max-width: 600px;

    padding: 20px;

    border:
        1px solid rgba(80,210,255,.25);

    background:
        rgba(0,100,160,.08);

    text-align: center;

    font-size: 12px;

    line-height: 1.7;
}

.jarvisButton {
    margin-top: 12px;

    padding: 12px 20px;

    border:
        1px solid rgba(100,220,255,.4);

    background:
        rgba(0,100,160,.12);

    color: #aeeeff;

    cursor: pointer;

    font-size: 9px;

    letter-spacing: 3px;
}

@media(max-width:700px) {

    .main {
        padding: 18px;
    }

    .panels {
        grid-template-columns: 1fr;
        gap: 6px;
    }

    .panel {
        padding: 8px;
    }

    .consoleWelcome {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="main">

    <div class="header">

        <div>
            <div class="system">
                PERSONAL INTERFACE
            </div>

            <div class="logo">
                JARVIS // CORE
            </div>
        </div>

        <div class="clock">

            <div id="time" class="time">
                --:--
            </div>

            <div id="date" class="date">
                ---
            </div>

        </div>

    </div>


    <div class="center">

        <div class="cameraBox">

            <video
                id="camera"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="faceCanvas"></canvas>

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="scanLine"></div>

        </div>


        <div id="systemStatus" class="status">
            STARTING CAMERA
        </div>

        <div id="systemSubstatus" class="substatus">
            CAMERA INITIALIZATION
        </div>

        <button id="setupFace" class="faceButton">
            SET UP FACE
        </button>

    </div>


    <div class="panels">

        <div class="panel">

            <div class="panel-title">
                CAMERA
            </div>

            <div id="cameraStatus" class="panel-value">
                STARTING
            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                SECURITY
            </div>

            <div id="securityStatus" class="panel-value">
                INITIALIZING
            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                SYSTEM
            </div>

            <div class="panel-value">
                ONLINE
            </div>

        </div>

    </div>

</div>


<!-- WELCOME -->

<div id="jarvisConsole">

    <div class="consoleWelcome">
        WELCOME BACK
    </div>

    <div class="consoleName">
        BLAKE
    </div>

    <div id="consoleMessage" class="consoleMessage">
        IDENTITY VERIFIED. JARVIS ONLINE.
    </div>

    <button id="openAI" class="jarvisButton">
        OPEN JARVIS AI
    </button>

    <button id="closeConsole" class="jarvisButton">
        RETURN TO SYSTEM
    </button>

</div>


<script>

/* =========================
   CLOCK
========================= */

function updateClock() {

    const now = new Date();

    document.getElementById("time")
        .textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date")
        .textContent =
        now.toLocaleDateString([], {
            weekday: "long",
            month: "long",
            day: "numeric"
        }).toUpperCase();
}

updateClock();

setInterval(updateClock, 1000);


/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("faceCanvas");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("systemStatus");

const substatus =
    document.getElementById("systemSubstatus");

const cameraStatus =
    document.getElementById("cameraStatus");

const securityStatus =
    document.getElementById("securityStatus");

const setupButton =
    document.getElementById("setupFace");


/* =========================
   CAMERA FIRST
========================= */

async function startCamera() {

    status.textContent =
        "STARTING CAMERA";

    substatus.textContent =
        "REQUESTING CAMERA ACCESS";

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera API unavailable"
            );

        }

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",
                    width: {
                        ideal: 640
                    },
                    height: {
                        ideal: 480
                    }
                },

                audio: false

            });

        video.srcObject = stream;

        await video.play();

        cameraStatus.textContent =
            "ONLINE";

        status.textContent =
            "CAMERA ONLINE";

        substatus.textContent =
            "LOADING FACE SYSTEM";

        resizeCanvas();

        loadFaceModels();

    } catch (error) {

        console.error(error);

        cameraStatus.textContent =
            "ERROR";

        status.textContent =
            "CAMERA ERROR";

        substatus.textContent =
            error.message ||
            "ALLOW CAMERA ACCESS";

    }
}


/* =========================
   RESIZE CANVAS
========================= */

function resizeCanvas() {

    if (!video.videoWidth) {
        return;
    }

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}

video.addEventListener(
    "loadedmetadata",
    resizeCanvas
);


/* =========================
   REMOTE MODELS
========================= */

/*
   These are hosted model assets.

   No /models folder is required
   for this version.
*/

const MODEL_URL =
    "https://justadudewhohacks.github.io/face-api.js/models";


async function loadFaceModels() {

    securityStatus.textContent =
        "LOADING";

    try {

        await faceapi.nets.tinyFaceDetector.loadFromUri(
            MODEL_URL
        );

        await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
            MODEL_URL
        );

        await faceapi.nets.faceRecognitionNet.loadFromUri(
            MODEL_URL
        );

        securityStatus.textContent =
            "READY";

        status.textContent =
            "FACE SYSTEM READY";

        substatus.textContent =
            "LOOK AT THE CAMERA";

        beginFaceTracking();

    } catch (error) {

        console.error(
            "FACE MODEL ERROR:",
            error
        );

        securityStatus.textContent =
            "MODEL ERROR";

        status.textContent =
            "CAMERA WORKING";

        substatus.textContent =
            "FACE MODELS FAILED TO LOAD";

    }
}


/* =========================
   FACE STORAGE
========================= */

let savedDescriptor =
    null;

const saved =
    localStorage.getItem(
        "jarvisFaceDescriptor"
    );

if (saved) {

    try {

        savedDescriptor =
            new Float32Array(
                JSON.parse(saved)
            );

        securityStatus.textContent =
            "FACE SAVED";

    } catch (error) {

        console.error(error);

    }
}


/* =========================
   FACE MESH
========================= */

function drawFaceMesh(
    detection
) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const points =
        detection.landmarks.positions;

    /*
       Draw the green mesh only around
       the actual detected face.
    */

    ctx.strokeStyle =
        "#39ff88";

    ctx.fillStyle =
        "#39ff88";

    ctx.lineWidth = 1;

    const connections = [

        [0,16],
        [17,21],
        [22,26],
        [27,35],
        [36,41],
        [42,47],
        [48,59],
        [60,67]

    ];

    connections.forEach(
        pair => {

            ctx.beginPath();

            const start =
                points[pair[0]];

            ctx.moveTo(
                start.x,
                start.y
            );

            for (
                let i = pair[0] + 1;
                i <= pair[1];
                i++
            ) {

                ctx.lineTo(
                    points[i].x,
                    points[i].y
                );

            }

            ctx.stroke();

        }
    );


    points.forEach(
        point => {

            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y,
                1.5,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );
}


/* =========================
   FACE TRACKING
========================= */

let faceBusy = false;

let lastAuth =
    0;

async function beginFaceTracking() {

    async function loop() {

        if (
            video.readyState >= 2 &&
            !faceBusy
        ) {

            faceBusy = true;

            try {

                const result =
                    await faceapi
                        .detectSingleFace(
                            video,
                            new faceapi.TinyFaceDetectorOptions({
                                inputSize: 320,
                                scoreThreshold: 0.35
                            })
                        )
                        .withFaceLandmarks(true)
                        .withFaceDescriptor();

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                if (!result) {

                    status.textContent =
                        "NO FACE FOUND";

                    substatus.textContent =
                        "LOOK AT THE CAMERA";

                } else {

                    drawFaceMesh(result);

                    status.textContent =
                        "FACE DETECTED";

                    substatus.textContent =
                        "ANALYZING IDENTITY";

                    if (
                        savedDescriptor &&
                        Date.now() - lastAuth > 5000
                    ) {

                        authenticate(
                            result
                        );

                    }

                }

            } catch (error) {

                console.error(
                    "FACE TRACKING ERROR:",
                    error
                );

            }

            faceBusy = false;

        }

        requestAnimationFrame(loop);

    }

    loop();
}


/* =========================
   SAVE FACE
========================= */

setupButton.addEventListener(
    "click",
    async () => {

        if (!video.videoWidth) {

            status.textContent =
                "CAMERA NOT READY";

            return;

        }

        status.textContent =
            "CAPTURING FACE";

        substatus.textContent =
            "HOLD STILL";

        try {

            const result =
                await faceapi
                    .detectSingleFace(
                        video,
                        new faceapi.TinyFaceDetectorOptions({
                            inputSize: 320,
                            scoreThreshold: 0.35
                        })
                    )
                    .withFaceLandmarks(true)
                    .withFaceDescriptor();

            if (!result) {

                status.textContent =
                    "NO FACE FOUND";

                substatus.textContent =
                    "MOVE CLOSER AND TRY AGAIN";

                return;

            }

            savedDescriptor =
                new Float32Array(
                    result.descriptor
                );

            localStorage.setItem(
                "jarvisFaceDescriptor",
                JSON.stringify(
                    Array.from(
                        savedDescriptor
                    )
                )
            );

            securityStatus.textContent =
                "FACE REGISTERED";

            status.textContent =
                "FACE SAVED";

            substatus.textContent =
                "IDENTITY READY";

        } catch (error) {

            console.error(error);

            status.textContent =
                "SETUP ERROR";

            substatus.textContent =
                "TRY AGAIN";

        }

    }
);


/* =========================
   AUTHENTICATION
========================= */

async function authenticate(
    result
) {

    lastAuth =
        Date.now();

    const distance =
        faceapi.euclideanDistance(
            savedDescriptor,
            result.descriptor
        );

    console.log(
        "Face distance:",
        distance
    );

    /*
       This is only a demo-style
       browser face match, not high-security
       biometric authentication.
    */

    if (distance < 0.50) {

        status.textContent =
            "IDENTITY VERIFIED";

        substatus.textContent =
            "ACCESS AUTHORIZED";

        securityStatus.textContent =
            "BLAKE VERIFIED";

        setTimeout(
            openConsole,
            1000
        );

    } else {

        status.textContent =
            "ACCESS DENIED";

        substatus.textContent =
            "IDENTITY NOT RECOGNIZED";

        securityStatus.textContent =
            "UNKNOWN USER";

    }
}


/* =========================
   CONSOLE
========================= */

function openConsole() {

    document
        .getElementById(
            "jarvisConsole"
        )
        .classList
        .add("open");

}


/* =========================
   CLOSE
========================= */

document
    .getElementById(
        "closeConsole"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "jarvisConsole"
                )
                .classList
                .remove("open");

        }
    );


/* =========================
   JARVIS AI BUTTON
========================= */

document
    .getElementById(
        "openAI"
    )
    .addEventListener(
        "click",
        () => {

            /*
               Keep your existing AI screen
               code here if you already have it.
            */

            alert(
                "JARVIS AI screen goes here."
            );

        }
    );


/* =========================
   START
========================= */

startCamera();

</script>

</body>
</html>
