<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #020810;

    color: #aeeeff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {

    background:
        radial-gradient(
            circle at center,
            rgba(0,150,255,.20),
            #020810 70%
        );
}


/* =========================
   BACKGROUND
========================= */

.grid {

    position: fixed;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(50,190,255,.10) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(50,190,255,.10) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

}


/* =========================
   MAIN SYSTEM
========================= */

.main {

    position: relative;

    z-index: 2;

    width: 100%;
    height: 100%;

    padding: 25px;

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

}


.header {

    display: flex;

    justify-content:
        space-between;

}


.system {

    font-size: 10px;

    letter-spacing: 4px;

    opacity: .45;

}


.logo {

    margin-top: 7px;

    font-size: 24px;

    letter-spacing: 6px;

    text-shadow:
        0 0 15px
        rgba(80,220,255,.7);

}


.clock {

    text-align: right;

}


.time {

    font-size: 30px;

}


.date {

    margin-top: 5px;

    font-size: 9px;

    letter-spacing: 2px;

    opacity: .4;

}


/* =========================
   HUD
========================= */

.center {

    display: flex;

    flex-direction: column;

    align-items: center;

}


.hud {

    position: relative;

    width: 300px;

    height: 300px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(90,220,255,.5);

}


.ring1 {

    width: 285px;
    height: 285px;

}


.ring2 {

    width: 230px;
    height: 230px;

    border-style: dashed;

    animation:
        rotate 14s linear infinite;

}


.ring3 {

    width: 175px;
    height: 175px;

}


.ring4 {

    width: 120px;
    height: 120px;

    animation:
        pulse 2s infinite;

}


@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


@keyframes pulse {

    0%, 100% {

        transform: scale(.9);

        opacity: .4;

    }

    50% {

        transform: scale(1.08);

        opacity: 1;

    }

}


.scan {

    position: absolute;

    width: 220px;

    height: 2px;

    background: #d8faff;

    box-shadow:

        0 0 10px #58dcff,

        0 0 30px #009fe0;

    animation:
        scan 2.5s ease-in-out infinite;

}


@keyframes scan {

    0%, 100% {

        transform:
            translateY(-105px);

        opacity: .2;

    }

    50% {

        transform:
            translateY(105px);

        opacity: 1;

    }

}


.core {

    width: 18px;

    height: 18px;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 10px white,

        0 0 30px #28c8ff,

        0 0 65px #008bd0;

}


.corner {

    position: absolute;

    width: 28px;

    height: 28px;

    border:
        2px solid #7de5ff;

}


.tl {

    top: 5px;
    left: 5px;

    border-right: 0;
    border-bottom: 0;

}


.tr {

    top: 5px;
    right: 5px;

    border-left: 0;
    border-bottom: 0;

}


.bl {

    bottom: 5px;
    left: 5px;

    border-right: 0;
    border-top: 0;

}


.br {

    bottom: 5px;
    right: 5px;

    border-left: 0;
    border-top: 0;

}


.status {

    margin-top: 5px;

    font-size: 14px;

    letter-spacing: 5px;

}


.substatus {

    margin-top: 8px;

    font-size: 9px;

    letter-spacing: 3px;

    opacity: .4;

}


/* =========================
   PANELS
========================= */

.panels {

    width: 100%;

    max-width: 900px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}


.panel {

    padding: 14px;

    border:
        1px solid
        rgba(80,210,255,.2);

    background:
        rgba(0,100,160,.06);

}


.panel-title {

    font-size: 8px;

    letter-spacing: 2px;

    opacity: .4;

}


.panel-value {

    margin-top: 10px;

    font-size: 11px;

}


/* =========================
   WELCOME SCREEN
========================= */

#jarvisConsole {

    position: fixed;

    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:

        radial-gradient(
            circle at center,
            rgba(0,150,255,.18),
            #020810 65%
        );

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .6s;

}


#jarvisConsole.open {

    opacity: 1;

    pointer-events: auto;

}


.consoleGrid {

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(50,190,255,.12) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(50,190,255,.12) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    opacity: .3;

}


.consoleCore {

    position: relative;

    width: 220px;
    height: 220px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.consoleRing {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(90,220,255,.6);

}


.ringA {

    width: 210px;
    height: 210px;

    animation:
        spin 12s linear infinite;

}


.ringB {

    width: 165px;
    height: 165px;

    border-style: dashed;

    animation:
        spinReverse 8s linear infinite;

}


.ringC {

    width: 110px;
    height: 110px;

    animation:
        pulse 2s infinite;

}


.consoleDot {

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 15px white,

        0 0 35px #22c8ff,

        0 0 60px #008bd0;

}


@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


@keyframes spinReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }

}


.consoleStatus {

    position: relative;

    margin-top: 25px;

    font-size: 10px;

    letter-spacing: 5px;

    opacity: .5;

}


.consoleWelcome {

    position: relative;

    margin-top: 15px;

    font-size: 34px;

    letter-spacing: 7px;

    text-shadow:
        0 0 20px
        rgba(80,220,255,.7);

}


.consoleName {

    position: relative;

    margin-top: 10px;

    font-size: 15px;

    letter-spacing: 6px;

}


.consoleMessage {

    position: relative;

    margin-top: 35px;

    width: 80%;

    max-width: 650px;

    padding: 20px;

    border:
        1px solid
        rgba(80,210,255,.25);

    background:
        rgba(0,100,160,.08);

    text-align: center;

    font-size: 12px;

    letter-spacing: 2px;

    line-height: 1.8;

}


.jarvisButton {

    position: relative;

    margin-top: 12px;

    padding: 12px 20px;

    border:
        1px solid
        rgba(100,220,255,.4);

    background:
        rgba(0,100,160,.12);

    color: #aeeeff;

    font-size: 9px;

    letter-spacing: 3px;

    cursor: pointer;

}


/* =========================
   AI SCREEN
========================= */

#aiScreen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;

    background:

        radial-gradient(
            circle at center,
            rgba(0,150,255,.18),
            #020810 70%
        );

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .5s;

    padding: 25px;

}


#aiScreen.open {

    opacity: 1;

    pointer-events: auto;

}


.aiGrid {

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(50,190,255,.10) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(50,190,255,.10) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

}


.aiHeader {

    position: relative;

    z-index: 2;

    width: 100%;

    display: flex;

    justify-content:
        space-between;

}


.aiSmall {

    font-size: 9px;

    letter-spacing: 3px;

    opacity: .4;

}


.aiTitle {

    margin-top: 5px;

    font-size: 28px;

    letter-spacing: 6px;

    text-shadow:
        0 0 20px
        rgba(70,220,255,.7);

}


.aiStatus {

    font-size: 9px;

    letter-spacing: 3px;

}


.aiOrb {

    position: relative;

    width: 210px;

    height: 210px;

    margin-top: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.aiRing {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(70,210,255,.5);

}


.aiRing1 {

    width: 200px;
    height: 200px;

    animation:
        spin 12s linear infinite;

}


.aiRing2 {

    width: 155px;
    height: 155px;

    border-style: dashed;

    animation:
        spinReverse 8s linear infinite;

}


.aiRing3 {

    width: 105px;
    height: 105px;

    animation:
        pulse 2s infinite;

}


.aiCore {

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: white;

    box-shadow:

        0 0 15px white,

        0 0 35px #21caff,

        0 0 70px #008bd0;

}


/* =========================
   CHAT
========================= */

.aiMessages {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 700px;

    flex: 1;

    overflow-y: auto;

    padding: 10px 5px;

}


.aiMessage {

    padding: 13px 16px;

    margin-bottom: 12px;

    border:
        1px solid
        rgba(70,210,255,.2);

    background:
        rgba(0,100,160,.08);

    font-size: 12px;

    line-height: 1.6;

}


.jarvisMessage {

    border-left:
        2px solid
        #5edcff;

}


.userMessage {

    border-right:
        2px solid
        #5edcff;

    text-align: right;

}


/* =========================
   INPUT
========================= */

.aiInputArea {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 700px;

    display: flex;

    gap: 8px;

}


#aiInput {

    flex: 1;

    padding: 15px;

    border:
        1px solid
        rgba(70,210,255,.3);

    outline: none;

    background:
        rgba(0,50,80,.5);

    color:
        #bdf2ff;

    font-size: 12px;

}


#aiInput::placeholder {

    color:
        rgba(160,230,255,.4);

}


#aiSend,
#aiMic,
#aiBack {

    border:
        1px solid
        rgba(70,210,255,.35);

    background:
        rgba(0,100,160,.12);

    color:
        #aeeeff;

    cursor: pointer;

    letter-spacing: 2px;

}


#aiSend,
#aiMic {

    padding:
        0 16px;

}


#aiBack {

    position: relative;

    z-index: 2;

    margin-top: 12px;

    margin-bottom: 10px;

    padding:
        10px 20px;

    font-size: 9px;

}


/* MOBILE */

@media(max-width:700px) {

    .main {

        padding: 18px;

    }

    .hud {

        transform:
            scale(.8);

    }

    .panels {

        grid-template-columns:
            1fr;

        gap: 7px;

    }

    .panel {

        padding: 9px;

    }

    .consoleWelcome {

        font-size: 25px;

    }

}

</style>

</head>


<body>


<div class="grid"></div>


<!-- MAIN SYSTEM -->

<div class="main">

    <div class="header">

        <div>

            <div class="system">
                PERSONAL INTERFACE
            </div>

            <div class="logo">
                JARVIS // CORE
            </div>

        </div>


        <div class="clock">

            <div
                class="time"
                id="time">
                --:--
            </div>

            <div
                class="date"
                id="date">
                ---
            </div>

        </div>

    </div>


    <div class="center">

        <div class="hud">

            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
            <div class="ring ring3"></div>
            <div class="ring ring4"></div>

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="scan"></div>

            <div class="core"></div>

        </div>


        <div
            class="status"
            id="systemStatus">

            SYSTEM READY

        </div>


        <div
            class="substatus"
            id="systemSubstatus">

            MONITORING ENVIRONMENT

        </div>

    </div>


    <div class="panels">

        <div class="panel">

            <div class="panel-title">
                CORE STATUS
            </div>

            <div class="panel-value">
                ONLINE
            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                SECURITY
            </div>

            <div class="panel-value">
                AUTHENTICATION READY
            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                SYSTEM
            </div>

            <div class="panel-value">
                ALL SYSTEMS NOMINAL
            </div>

        </div>

    </div>

</div>


<!-- WELCOME -->

<div id="jarvisConsole">

    <div class="consoleGrid"></div>


    <div class="consoleCore">

        <div class="consoleRing ringA"></div>

        <div class="consoleRing ringB"></div>

        <div class="consoleRing ringC"></div>

        <div class="consoleDot"></div>

    </div>


    <div class="consoleStatus">
        IDENTITY VERIFIED
    </div>


    <div class="consoleWelcome">
        WELCOME BACK
    </div>


    <div class="consoleName">
        BLAKE
    </div>


    <div
        class="consoleMessage"
        id="consoleMessage">

        JARVIS INITIALIZING...

    </div>


    <button
        class="jarvisButton"
        id="enableVoice">

        ENABLE JARVIS VOICE

    </button>


    <button
        class="jarvisButton"
        id="openAI">

        OPEN JARVIS AI

    </button>


    <button
        class="jarvisButton"
        id="closeConsole">

        RETURN TO SYSTEM

    </button>

</div>


<!-- AI -->

<div id="aiScreen">

    <div class="aiGrid"></div>


    <div class="aiHeader">

        <div>

            <div class="aiSmall">
                JARVIS ARTIFICIAL INTELLIGENCE
            </div>

            <div class="aiTitle">
                AI CORE
            </div>

        </div>


        <div
            id="aiStatus"
            class="aiStatus">

            ONLINE

        </div>

    </div>


    <div class="aiOrb">

        <div
            class="aiRing aiRing1">
        </div>

        <div
            class="aiRing aiRing2">
        </div>

        <div
            class="aiRing aiRing3">
        </div>

        <div class="aiCore"></div>

    </div>


    <div
        id="aiMessages"
        class="aiMessages">

        <div
            class="aiMessage jarvisMessage">

            JARVIS ONLINE.
            HOW CAN I HELP?

        </div>

    </div>


    <div class="aiInputArea">

        <input
            id="aiInput"
            type="text"
            placeholder="Talk to JARVIS..."
            autocomplete="off"
        >


        <button id="aiSend">
            SEND
        </button>


        <button id="aiMic">
            🎙
        </button>

    </div>


    <button id="aiBack">

        RETURN TO JARVIS

    </button>

</div>


<script>


/* =========================
   CLOCK
========================= */

function updateClock() {

    const now =
        new Date();


    document
        .getElementById("time")
        .textContent =

        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    document
        .getElementById("date")
        .textContent =

        now.toLocaleDateString(
            [],
            {
                weekday: "long",
                month: "long",
                day: "numeric"
            }
        ).toUpperCase();

}


updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================
   CAMERA
========================= */

const video =
    document.createElement("video");

video.setAttribute(
    "playsinline",
    ""
);

video.muted = true;


const canvas =
    document.createElement("canvas");

const ctx =
    canvas.getContext("2d");


let previousFrame = null;

let scanning = false;

let lastScan = 0;


async function startCamera() {

    try {

        const stream =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user",

                        width: 320,

                        height: 240

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        canvas.width = 64;

        canvas.height = 48;


        setTimeout(
            checkMotion,
            1000
        );


    } catch(error) {

        console.log(
            "Camera error:",
            error
        );

    }

}


function checkMotion() {

    if (!video.videoWidth) {

        setTimeout(
            checkMotion,
            500
        );

        return;

    }


    ctx.drawImage(
        video,
        0,
        0,
        64,
        48
    );


    const frame =
        ctx.getImageData(
            0,
            0,
            64,
            48
        );


    if (previousFrame) {

        let difference = 0;


        for (
            let i = 0;
            i < frame.data.length;
            i += 16
        ) {

            difference +=

                Math.abs(
                    frame.data[i] -
                    previousFrame.data[i]
                );

        }


        difference /=

            frame.data.length / 16;


        if (

            difference > 10 &&

            !scanning &&

            Date.now() -
            lastScan > 10000

        ) {

            lastScan =
                Date.now();

            runScan();

        }

    }


    previousFrame =
        frame;


    setTimeout(
        checkMotion,
        400
    );

}


/* =========================
   SCAN
========================= */

function runScan() {

    scanning = true;


    const status =
        document.getElementById(
            "systemStatus"
        );


    const sub =
        document.getElementById(
            "systemSubstatus"
        );


    status.textContent =
        "MOTION DETECTED";


    sub.textContent =
        "ANALYZING SUBJECT";


    setTimeout(() => {

        status.textContent =
            "SCANNING...";

        sub.textContent =
            "IDENTITY ANALYSIS";

    }, 2000);


    setTimeout(() => {

        status.textContent =
            "IDENTITY VERIFIED";

        sub.textContent =
            "ACCESS AUTHORIZED";

    }, 5000);


    setTimeout(() => {

        openConsole();

    }, 7000);

}


/* =========================
   VOICE
========================= */

let voiceEnabled = false;

let jarvisVoice = null;


function loadJarvisVoice() {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    const voices =
        speechSynthesis.getVoices();


    if (!voices.length) {

        return;

    }


    const preferred = [

        "Daniel",
        "Alex",
        "Fred",
        "Oliver",
        "Arthur"

    ];


    for (
        const name
        of preferred
    ) {

        const found =
            voices.find(
                voice =>
                    voice.name
                        .toLowerCase()
                        .includes(
                            name.toLowerCase()
                        )
            );


        if (found) {

            jarvisVoice =
                found;

            break;

        }

    }


    if (!jarvisVoice) {

        jarvisVoice =
            voices.find(
                voice =>
                    voice.lang
                        .toLowerCase()
                        .startsWith("en")
            );

    }

}


loadJarvisVoice();


speechSynthesis.onvoiceschanged =
    loadJarvisVoice;


function speak(text) {

    if (
        !voiceEnabled ||
        !("speechSynthesis" in window)
    ) {

        return;

    }


    loadJarvisVoice();

    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    if (jarvisVoice) {

        utterance.voice =
            jarvisVoice;

    }


    utterance.rate =
        .82;

    utterance.pitch =
        .72;

    utterance.volume =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* ENABLE VOICE */

document
    .getElementById(
        "enableVoice"
    )
    .addEventListener(
        "click",
        function() {

            voiceEnabled =
                true;


            speak(
                "JARVIS voice online."
            );


            this.textContent =
                "JARVIS VOICE ONLINE";

        }
    );


/* =========================
   WELCOME
========================= */

function openConsole() {

    document
        .getElementById(
            "jarvisConsole"
        )
        .classList.add(
            "open"
        );


    document
        .getElementById(
            "consoleMessage"
        )
        .textContent =

        "JARVIS ONLINE. ALL SYSTEMS ARE OPERATIONAL.";


    if (voiceEnabled) {

        speak(
            "Welcome back, Blake. All systems are operational."
        );

    }

}


document
    .getElementById(
        "closeConsole"
    )
    .addEventListener(
        "click",
        function() {

            document
                .getElementById(
                    "jarvisConsole"
                )
                .classList.remove(
                    "open"
                );


            document
                .getElementById(
                    "systemStatus"
                )
                .textContent =
                "SYSTEM READY";


            document
                .getElementById(
                    "systemSubstatus"
                )
                .textContent =
                "MONITORING ENVIRONMENT";


            scanning = false;

        }
    );


/* =========================
   AI
========================= */

const aiScreen =
    document.getElementById(
        "aiScreen"
    );


const aiInput =
    document.getElementById(
        "aiInput"
    );


const aiMessages =
    document.getElementById(
        "aiMessages"
    );


const aiStatus =
    document.getElementById(
        "aiStatus"
    );


function addMessage(
    text,
    isUser
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        isUser
        ? "aiMessage userMessage"
        : "aiMessage jarvisMessage";


    message.textContent =
        text;


    aiMessages.appendChild(
        message
    );


    aiMessages.scrollTop =
        aiMessages.scrollHeight;

}


/* =========================
   REAL AI REQUEST
========================= */

async function sendMessage() {

    const text =
        aiInput.value.trim();


    if (!text) {

        return;

    }


    addMessage(
        text,
        true
    );


    aiInput.value = "";


    aiStatus.textContent =
        "THINKING...";


    try {

        const response =
            await fetch(
                "https://jarvis-wall-two.vercel.app",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        message: text

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI request failed"
            );

        }


        addMessage(
            data.reply,
            false
        );


        speak(
            data.reply
        );


        aiStatus.textContent =
            "ONLINE";


    } catch(error) {

        console.error(error);


        addMessage(
            "I couldn't connect to my AI core. Check the backend connection.",
            false
        );


        aiStatus.textContent =
            "CONNECTION ERROR";

    }

}


/* OPEN AI */

document
    .getElementById(
        "openAI"
    )
    .addEventListener(
        "click",
        function() {

            aiScreen
                .classList
                .add("open");

            aiInput.focus();

        }
    );


/* BACK */

document
    .getElementById(
        "aiBack"
    )
    .addEventListener(
        "click",
        function() {

            aiScreen
                .classList
                .remove("open");

        }
    );


/* SEND */

document
    .getElementById(
        "aiSend"
    )
    .addEventListener(
        "click",
        sendMessage
    );


/* ENTER */

aiInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            sendMessage();

        }

    }
);


/* =========================
   MICROPHONE
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    document
        .getElementById(
            "aiMic"
        )
        .addEventListener(
            "click",
            function() {

                aiStatus.textContent =
                    "LISTENING...";


                recognition.start();

            }
        );


    recognition.onresult =
        function(event) {

            aiInput.value =
                event
                    .results[0][0]
                    .transcript;


            sendMessage();

        };


    recognition.onerror =
        function() {

            aiStatus.textContent =
                "ONLINE";

        };

}


/* =========================
   START
========================= */

startCamera();

</script>
