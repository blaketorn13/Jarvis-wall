<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020810;
    color: #9eeaff;
    font-family: Arial, Helvetica, sans-serif;
}

* {
    box-sizing: border-box;
}

body {
    background:
        radial-gradient(circle at center,
            rgba(0,150,255,.20) 0%,
            rgba(0,40,70,.12) 35%,
            #020810 70%);
}

/* BACKGROUND GRID */

.grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(50,190,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(50,190,255,.12) 1px, transparent 1px);
    background-size: 45px 45px;
}

/* MAIN */

.main {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
}

.system {
    font-size: 10px;
    letter-spacing: 4px;
    opacity: .45;
}

.logo {
    margin-top: 7px;
    font-size: 24px;
    letter-spacing: 6px;
    text-shadow: 0 0 15px rgba(80,220,255,.7);
}

.clock {
    text-align: right;
}

.time {
    font-size: 30px;
}

.date {
    font-size: 9px;
    letter-spacing: 2px;
    opacity: .4;
    margin-top: 5px;
}

/* CENTER */

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* HUD */

.hud {
    position: relative;
    width: 300px;
    height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* RINGS */

.ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(90,220,255,.5);
}

.ring1 {
    width: 285px;
    height: 285px;
}

.ring2 {
    width: 230px;
    height: 230px;
    border-style: dashed;
    animation: rotate 14s linear infinite;
}

.ring3 {
    width: 175px;
    height: 175px;
    opacity: .7;
}

.ring4 {
    width: 120px;
    height: 120px;
    animation: pulse 2s infinite;
}

/* ROTATION */

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* PULSE */

@keyframes pulse {
    0%, 100% {
        transform: scale(.9);
        opacity: .4;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }
}

/* SCAN LINE */

.scan {
    position: absolute;
    width: 220px;
    height: 2px;
    background: #d8faff;
    box-shadow:
        0 0 10px #58dcff,
        0 0 30px #009fe0;
    animation: scan 2.5s ease-in-out infinite;
}

@keyframes scan {
    0%, 100% {
        transform: translateY(-105px);
        opacity: .2;
    }

    50% {
        transform: translateY(105px);
        opacity: 1;
    }
}

/* CORE */

.core {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 10px white,
        0 0 30px #28c8ff,
        0 0 65px #008bd0;
}

/* CORNER MARKERS */

.corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: #7de5ff;
    border-style: solid;
}

.tl {
    top: 5px;
    left: 5px;
    border-width: 2px 0 0 2px;
}

.tr {
    top: 5px;
    right: 5px;
    border-width: 2px 2px 0 0;
}

.bl {
    bottom: 5px;
    left: 5px;
    border-width: 0 0 2px 2px;
}

.br {
    bottom: 5px;
    right: 5px;
    border-width: 0 2px 2px 0;
}

/* STATUS */

.status {
    margin-top: 5px;
    font-size: 14px;
    letter-spacing: 5px;
}

.substatus {
    margin-top: 8px;
    font-size: 9px;
    letter-spacing: 3px;
    opacity: .4;
}

/* PANELS */

.panels {
    width: 100%;
    max-width: 900px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.panel {
    padding: 14px;
    border: 1px solid rgba(80,210,255,.2);
    background: rgba(0,100,160,.06);
}

.panel-title {
    font-size: 8px;
    letter-spacing: 2px;
    opacity: .4;
}

.panel-value {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 1px;
}

.dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #bff6ff;
    box-shadow: 0 0 10px #42d9ff;
    margin-right: 6px;
}

/* FOOTER */

.footer {
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    letter-spacing: 2px;
    opacity: .3;
}

/* MOBILE */

@media(max-width:700px) {

    .main {
        padding: 18px;
    }

    .hud {
        transform: scale(.8);
    }

    .panels {
        grid-template-columns: 1fr;
        gap: 7px;
    }

    .panel {
        padding: 9px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="main">

    <div class="header">

        <div>
            <div class="system">
                PERSONAL INTERFACE
            </div>

            <div class="logo">
                JARVIS // CORE
            </div>
        </div>

        <div class="clock">

            <div
                class="time"
                id="time">
                --:--
            </div>

            <div
                class="date"
                id="date">
                ---
            </div>

        </div>

    </div>


    <div class="center">

        <div class="hud">

            <div class="ring ring1"></div>

            <div class="ring ring2"></div>

            <div class="ring ring3"></div>

            <div class="ring ring4"></div>

            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="scan"></div>

            <div class="core"></div>

        </div>

        <div class="status">
            SYSTEM READY
        </div>

        <div class="substatus">
            MONITORING ENVIRONMENT
        </div>

    </div>


    <div class="panels">

        <div class="panel">

            <div class="panel-title">
                CORE STATUS
            </div>

            <div class="panel-value">
                <span class="dot"></span>
                ONLINE
            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                SECURITY
            </div>

            <div class="panel-value">
                AUTHENTICATION READY
            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                SYSTEM
            </div>

            <div class="panel-value">
                ALL SYSTEMS NOMINAL
            </div>

        </div>

    </div>


    <div class="footer">

        <div>
            JARVIS CORE 01
        </div>

        <div>
            LOCAL SYSTEM
        </div>

        <div>
            ONLINE
        </div>

    </div>

</div>


<script>

function updateClock() {

    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString([], {
            weekday: "long",
            month: "long",
            day: "numeric"
        }).toUpperCase();
}

updateClock();

setInterval(updateClock, 1000);


/* =========================
   CAMERA SENSOR
========================= */

let video = document.createElement("video");

video.setAttribute("playsinline", "");
video.muted = true;

let canvas = document.createElement("canvas");
let ctx = canvas.getContext("2d");

let previousFrame = null;
let lastMotion = 0;
let scanning = false;


/* START CAMERA */

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",
                    width: 320,
                    height: 240
                },

                audio: false

            });

        video.srcObject = stream;

        await video.play();

        canvas.width = 80;
        canvas.height = 60;

        console.log("JARVIS CAMERA ONLINE");

        setTimeout(checkMotion, 1000);

    }

    catch(error) {

        console.log(
            "Camera unavailable:",
            error
        );

    }

}


/* =========================
   MOTION DETECTION
========================= */

function checkMotion() {

    if (!video.videoWidth) {

        setTimeout(checkMotion, 500);

        return;
    }


    ctx.drawImage(
        video,
        0,
        0,
        80,
        60
    );


    const currentFrame =
        ctx.getImageData(
            0,
            0,
            80,
            60
        );


    if (previousFrame) {

        let difference = 0;


        for (
            let i = 0;
            i < currentFrame.data.length;
            i += 20
        ) {

            difference +=
                Math.abs(
                    currentFrame.data[i] -
                    previousFrame.data[i]
                );

        }


        difference /=
            currentFrame.data.length / 20;


        if (
            difference > 25 &&
            !scanning &&
            Date.now() - lastMotion > 8000
        ) {

            lastMotion = Date.now();

            runJarvisScan();

        }

    }


    previousFrame =
        currentFrame;


    setTimeout(
        checkMotion,
        500
    );

}


/* =========================
   JARVIS SCAN
========================= */

function runJarvisScan() {

    scanning = true;


    const status =
        document.querySelector(".status");

    const substatus =
        document.querySelector(".substatus");


    status.textContent =
        "MOTION DETECTED";

    substatus.textContent =
        "ANALYZING SUBJECT";


    setTimeout(() => {

        status.textContent =
            "SCANNING...";

        substatus.textContent =
            "IDENTITY ANALYSIS";

    }, 1200);


    setTimeout(() => {

        status.textContent =
            "IDENTITY VERIFIED";

        substatus.textContent =
            "ACCESS AUTHORIZED";

    }, 2500);


    setTimeout(() => {

        status.textContent =
            "WELCOME BACK";

        substatus.textContent =
            "BLAKE // ACCESS GRANTED";

    }, 3500);


    setTimeout(() => {

        status.textContent =
            "SYSTEM READY";

        substatus.textContent =
            "MONITORING ENVIRONMENT";

        scanning = false;

    }, 6000);

}


/* START */

startCamera();

</script>

</body>
</html>
