<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="apple-mobile-web-app-title"
      content="JARVIS">

<title>JARVIS // CORE</title>

<style>

/* =========================
   BASE
========================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(70,150,190,.13),
      transparent 38%
    ),
    #030509;

  color: #eaf7ff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


/* =========================
   GRID
========================= */

body::before {
  content: "";

  position: fixed;
  inset: 0;

  opacity: .075;

  background-image:
    linear-gradient(
      rgba(180,230,255,.45) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(180,230,255,.45) 1px,
      transparent 1px
    );

  background-size: 45px 45px;

  pointer-events: none;
}


/* =========================
   SCANLINES
========================= */

body::after {
  content: "";

  position: fixed;
  inset: 0;

  pointer-events: none;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.015),
      rgba(255,255,255,.015) 1px,
      transparent 1px,
      transparent 4px
    );

  opacity: .35;
}


/* =========================
   MAIN INTERFACE
========================= */

.system {
  width: 100%;
  height: 100%;

  padding:
    28px
    34px
    20px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  position: relative;
}


/* =========================
   TOP BAR
========================= */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.system-title {
  font-size: 11px;
  letter-spacing: 4px;
  opacity: .42;
}

.system-name {
  margin-top: 6px;

  font-size: 21px;
  letter-spacing: 4px;

  text-shadow:
    0 0 15px rgba(210,245,255,.25);
}

.clock {
  text-align: right;
}

.time {
  font-size: 34px;
  font-weight: 300;
  letter-spacing: 2px;
}

.date {
  margin-top: 4px;

  font-size: 10px;
  letter-spacing: 2px;

  opacity: .38;
}


/* =========================
   CENTER
========================= */

.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}


/* =========================
   SCANNER
========================= */

.scanner {
  width: 300px;
  height: 300px;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* Main circles */

.circle {
  position: absolute;

  border-radius: 50%;

  border:
    1px solid
    rgba(190,235,255,.34);
}

.circle.one {
  width: 260px;
  height: 260px;

  box-shadow:
    0 0 35px rgba(150,220,255,.04);
}

.circle.two {
  width: 215px;
  height: 215px;

  border-style: dashed;

  opacity: .5;

  animation:
    rotate 16s linear infinite;
}

.circle.three {
  width: 165px;
  height: 165px;

  opacity: .55;
}


/* Inner ring */

.circle.four {
  width: 115px;
  height: 115px;

  border:
    1px solid
    rgba(220,247,255,.45);

  animation:
    pulse 2.8s ease-in-out infinite;
}


@keyframes rotate {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}


@keyframes pulse {

  0%,
  100% {
    transform: scale(.96);
    opacity: .35;
  }

  50% {
    transform: scale(1.04);
    opacity: .75;
  }

}


/* =========================
   CORNERS
========================= */

.corner {
  position: absolute;

  width: 34px;
  height: 34px;

  border-color: #d9f5ff;
  border-style: solid;

  opacity: .75;

  filter:
    drop-shadow(
      0 0 5px
      rgba(190,240,255,.4)
    );
}

.tl {
  top: 5px;
  left: 5px;

  border-width:
    2px
    0
    0
    2px;
}

.tr {
  top: 5px;
  right: 5px;

  border-width:
    2px
    2px
    0
    0;
}

.bl {
  bottom: 5px;
  left: 5px;

  border-width:
    0
    0
    2px
    2px;
}

.br {
  bottom: 5px;
  right: 5px;

  border-width:
    0
    2px
    2px
    0;
}


/* =========================
   SCANNING LINE
========================= */

.scan {
  position: absolute;

  width: 210px;
  height: 1px;

  background: #d8f6ff;

  box-shadow:
    0 0 8px #d8f6ff,
    0 0 18px rgba(190,240,255,.6);

  animation:
    scan 2.8s ease-in-out infinite;
}

@keyframes scan {

  0%,
  100% {
    transform:
      translateY(-105px);

    opacity: .15;
  }

  50% {
    transform:
      translateY(105px);

    opacity: 1;
  }

}


/* =========================
   CENTER DOT
========================= */

.center-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #eafaff;

  box-shadow:
    0 0 8px #d8f6ff,
    0 0 20px rgba(180,240,255,.8);
}


/* =========================
   STATUS
========================= */

.status {
  margin-top: 15px;

  font-size: 13px;

  letter-spacing: 5px;

  text-align: center;

  transition:
    opacity .3s ease;
}

.substatus {
  margin-top: 9px;

  font-size: 9px;

  letter-spacing: 3px;

  opacity: .38;

  text-align: center;
}


/* =========================
   PANELS
========================= */

.panels {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 14px;

  width: 100%;
  max-width: 900px;

  margin: 0 auto;
}

.panel {
  position: relative;

  border:
    1px solid
    rgba(190,230,255,.13);

  background:
    rgba(255,255,255,.018);

  padding: 15px;

  min-height: 72px;

  overflow: hidden;
}

.panel::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 25px;
  height: 1px;

  background:
    rgba(220,245,255,.65);
}

.panel-title {
  font-size: 8px;

  letter-spacing: 2px;

  opacity: .35;

  margin-bottom: 9px;
}

.panel-value {
  font-size: 12px;

  letter-spacing: 1px;
}

.online {
  display: inline-block;

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #c9f3ff;

  box-shadow:
    0 0 7px
    rgba(190,240,255,.9);

  margin-right: 7px;
}


/* =========================
   BOTTOM
========================= */

.bottom {
  display: flex;

  justify-content: space-between;

  font-size: 8px;

  letter-spacing: 2px;

  opacity: .28;
}


/* =========================
   WELCOME OVERLAY
========================= */

.welcome {
  position: fixed;

  inset: 0;

  background:
    radial-gradient(
      circle,
      rgba(50,130,170,.12),
      #030509 55%
    );

  display: flex;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .45s ease;

  z-index: 10;
}

.welcome.show {
  opacity: 1;
}

.w-small {
  font-size: 10px;

  letter-spacing: 5px;

  opacity: .45;
}

.w-big {
  margin-top: 18px;

  font-size: 40px;

  font-weight: 300;

  letter-spacing: 8px;

  text-shadow:
    0 0 25px
    rgba(210,245,255,.25);
}

.w-name {
  margin-top: 15px;

  font-size: 14px;

  letter-spacing: 6px;

  opacity: .7;
}

.access {
  margin-top: 28px;

  font-size: 9px;

  letter-spacing: 4px;

  opacity: .45;
}


/* =========================
   CAMERA
========================= */

/*
The camera is intentionally invisible.
It runs as the sensor while
the JARVIS interface remains visible.
*/

#camera,
#canvas {
  position: fixed;

  width: 1px;
  height: 1px;

  opacity: 0;

  pointer-events: none;
}


/* =========================
   ACTIVATE SCREEN
========================= */

.activate {
  position: fixed;

  inset: 0;

  background: #030509;

  z-index: 30;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-direction: column;
}

.activate.hidden {
  display: none;
}

.activate-title {
  font-size: 22px;

  letter-spacing: 5px;
}

.activate-text {
  margin-top: 14px;

  font-size: 10px;

  letter-spacing: 3px;

  opacity: .4;
}

button {
  margin-top: 28px;

  padding:
    14px
    24px;

  background:
    rgba(255,255,255,.02);

  color: #eaf7ff;

  border:
    1px solid
    rgba(220,245,255,.35);

  font-size: 10px;

  letter-spacing: 3px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  .system {
    padding:
      20px
      20px
      15px;
  }

  .scanner {
    transform: scale(.78);
  }

  .panels {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .panel {
    min-height: 48px;
    padding: 10px;
  }

  .panel-title {
    margin-bottom: 5px;
  }

  .bottom {
    font-size: 7px;
  }

  .w-big {
    font-size: 27px;
  }

}

</style>
</head>


<body>


<!-- =========================
     CAMERA ACTIVATION
========================= -->

<div
  class="activate"
  id="activate">

  <div class="activate-title">
    JARVIS // CORE
  </div>

  <div class="activate-text">
    PROXIMITY SENSOR OFFLINE
  </div>

  <button id="activateButton">
    ACTIVATE SENSOR
  </button>

</div>



<!-- =========================
     MAIN INTERFACE
========================= -->

<div class="system">


  <!-- TOP -->

  <div class="topbar">

    <div>

      <div class="system-title">
        PERSONAL INTERFACE
      </div>

      <div class="system-name">
        JARVIS // CORE
      </div>

    </div>


    <div class="clock">

      <div
        class="time"
        id="time">
        --:--
      </div>

      <div
        class="date"
        id="date">
        ---
      </div>

    </div>

  </div>



  <!-- CENTER -->

  <div class="center">


    <div class="scanner">


      <div class="circle one"></div>

      <div class="circle two"></div>

      <div class="circle three"></div>

      <div class="circle four"></div>


      <div class="corner tl"></div>

      <div class="corner tr"></div>

      <div class="corner bl"></div>

      <div class="corner br"></div>


      <div class="scan"></div>


      <div class="center-dot"></div>


    </div>


    <div
      class="status"
      id="status">

      SYSTEM READY

    </div>


    <div
      class="substatus"
      id="substatus">

      SENSOR STANDBY

    </div>


  </div>



  <!-- PANELS -->

  <div class="panels">


    <div class="panel">

      <div class="panel-title">
        CORE STATUS
      </div>

      <div class="panel-value">

        <span class="online"></span>

        ONLINE

      </div>

    </div>


    <div class="panel">

      <div class="panel-title">
        SECURITY
      </div>

      <div class="panel-value">
        AUTHENTICATION READY
      </div>

    </div>


    <div class="panel">

      <div class="panel-title">
        PROXIMITY SENSOR
      </div>

      <div
        class="panel-value"
        id="sensorStatus">

        OFFLINE

      </div>

    </div>


  </div>



  <!-- BOTTOM -->

  <div class="bottom">

    <div>
      JARVIS CORE 01
    </div>

    <div>
      LOCAL SYSTEM
    </div>

    <div>
      v3.0
    </div>

  </div>


</div>



<!-- =========================
     WELCOME
========================= -->

<div
  class="welcome"
  id="welcome">


  <div class="w-small">
    IDENTITY VERIFIED
  </div>


  <div class="w-big">
    WELCOME BACK
  </div>


  <div class="w-name">
    BLAKE
  </div>


  <div class="access">
    ACCESS GRANTED
  </div>


</div>



<!-- =========================
     INVISIBLE CAMERA
========================= -->

<video
  id="camera"
  autoplay
  playsinline
  muted>
</video>

<canvas id="canvas"></canvas>



<script>


/* =========================
   ELEMENTS
========================= */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const activate =
  document.getElementById("activate");

const activateButton =
  document.getElementById("activateButton");

const status =
  document.getElementById("status");

const substatus =
  document.getElementById("substatus");

const sensorStatus =
  document.getElementById("sensorStatus");

const welcome =
  document.getElementById("welcome");


/* =========================
   CLOCK
========================= */

function updateClock() {

  const now =
    new Date();

  document.getElementById("time")
    .textContent =
    now.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  document.getElementById("date")
    .textContent =
    now.toLocaleDateString(
      [],
      {
        weekday: "long",
        month: "long",
        day: "numeric"
      }
    )
    .toUpperCase();

}


updateClock();

setInterval(
  updateClock,
  1000
);


/* =========================
   DETECTION
========================= */

let previousFrame = null;

let scanning = false;

let lastTrigger = 0;


/* =========================
   CAMERA
========================= */

async function activateCamera() {

  try {


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: "user",

            width: {
              ideal: 640
            },

            height: {
              ideal: 480
            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    activate.classList
      .add("hidden");


    sensorStatus
      .textContent =
      "ONLINE";


    status.textContent =
      "SYSTEM READY";


    substatus.textContent =
      "MONITORING ENVIRONMENT";


    startDetection();


  }

  catch (error) {


    activateButton
      .textContent =
      "CAMERA ACCESS FAILED";


    substatus.textContent =
      "CHECK CAMERA PERMISSIONS";


  }

}


/* =========================
   BUTTON
========================= */

activateButton
  .addEventListener(
    "click",
    activateCamera
  );


/* =========================
   START DETECTION
========================= */

function startDetection() {

  canvas.width = 120;

  canvas.height = 90;


  setTimeout(
    checkFrame,
    1500
  );

}


/* =========================
   FRAME CHECK
========================= */

function checkFrame() {


  if (!video.videoWidth) {

    requestAnimationFrame(
      checkFrame
    );

    return;

  }


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const current =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  if (previousFrame) {


    let difference = 0;


    for (
      let i = 0;
      i < current.data.length;
      i += 20
    ) {

      difference +=
        Math.abs(
          current.data[i] -
          previousFrame.data[i]
        );

    }


    difference =
      difference /
      (current.data.length / 20);


    /*
      Movement threshold.

      Lower = more sensitive.
      Higher = less sensitive.
    */

    if (

      difference > 20 &&

      !scanning &&

      Date.now() -
      lastTrigger >
      10000

    ) {

      runScan();

    }

  }


  previousFrame =
    current;


  requestAnimationFrame(
    checkFrame
  );

}


/* =========================
   JARVIS SCAN
========================= */

function runScan() {


  scanning = true;

  lastTrigger =
    Date.now();


  status.textContent =
    "MOTION DETECTED";

  substatus.textContent =
    "ANALYZING SUBJECT";


  setTimeout(
    () => {

      status.textContent =
        "SCANNING...";

      substatus.textContent =
        "IDENTITY ANALYSIS";

    },
    900
  );


  setTimeout(
    () => {

      status.textContent =
        "IDENTITY VERIFIED";

      substatus.textContent =
        "ACCESS AUTHORIZED";

    },
    2200
  );


  setTimeout(
    () => {

      welcome.classList
        .add("show");

    },
    2700
  );


  setTimeout(
    () => {

      welcome.classList
        .remove("show");

    },
    5200
  );


  setTimeout(
    () => {

      status.textContent =
        "SYSTEM READY";

      substatus.textContent =
        "MONITORING ENVIRONMENT";

      scanning = false;

    },
    5700
  );

}


</script>

</body>
</html>
